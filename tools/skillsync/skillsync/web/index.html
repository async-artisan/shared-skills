<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skill-hub 控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- 暗色主题（默认，.light 缺省时生效）---------- */
  :root {
    --bg: #16140F;
    --bg-deep: #100E0A;
    --panel: #1F1C16;
    --panel-2: #28241D;
    --raise: #2E2A22;
    --ink: #ECE6D8;
    --ink-soft: #CFC8B8;
    --muted: #8E8775;
    --faint: #5E584C;
    --line: #322E25;
    --line-strong: #443E32;
    --accent: #5FC7A8;
    --accent-soft: #1A3A30;
    --accent-ink: #0E1B14;
    --amber: #E0A95C;
    --amber-fill: #E0A95C;
    --amber-soft: rgba(224,169,92,.12);
    --amber-line: rgba(224,169,92,.34);
    --green: #6FBF7E;
    --green-soft: rgba(111,191,126,.12);
    --green-line: rgba(111,191,126,.34);
    --red: #E58A72;
    --red-soft: rgba(229,138,114,.12);
    --red-line: rgba(229,138,114,.34);
    --blue: #7FB0D8;
    --blue-soft: rgba(127,176,216,.12);
    --blue-line: rgba(127,176,216,.34);
    --violet: #C9A6DC;
    --violet-soft: rgba(201,166,220,.12);
    --violet-line: rgba(201,166,220,.34);
    --pink: #E097B0;
    --pink-soft: rgba(224,151,176,.12);
    --pink-line: rgba(224,151,176,.34);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow: 0 6px 20px rgba(0,0,0,.35);
    --shadow-lg: 0 18px 50px rgba(0,0,0,.5);
    --radius: 12px;
    --radius-sm: 7px;
    --mono: "JetBrains Mono", "Microsoft YaHei", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --disp: "Microsoft YaHei", "PingFang SC", sans-serif;
    --sans: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Manrope", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { height: 100%; }
  body {
    margin: 0; height: 100%; overflow: hidden;
    display: flex; flex-direction: column;
    font: 14px/1.6 var(--sans);
    background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background .25s ease, color .25s ease;
  }
  ::selection { background: color-mix(in srgb, var(--accent) 26%, transparent); }
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 顶栏 ---------- */
  header {
    flex: none; height: 60px; z-index: 20;
    background: var(--bg-deep);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center;
    padding: 0 24px; gap: 14px;
  }
  .mark {
    width: 32px; height: 32px; flex: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--amber) 45%));
    color: var(--accent-ink);
    display: grid; place-items: center;
    box-shadow: var(--shadow-sm);
  }
  .mark svg { width: 18px; height: 18px; }
  .wm-name {
    font-family: var(--disp); font-weight: 600;
    font-size: 20px; letter-spacing: -.01em;
    color: var(--ink);
    font-variation-settings: "opsz" 144, "SOFT" 50;
  }
  .wm-sub { display: none; }
  .spacer { flex: 1; }
  .chip {
    font-family: var(--mono); font-size: 12px;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
    display: inline-flex; align-items: center; gap: 8px;
    max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); flex: none;
    box-shadow: 0 0 0 0 var(--green-line);
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--green-line); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .scan-time { font-family: var(--mono); font-size: 11.5px; color: var(--faint); letter-spacing: .04em; }

  /* ---------- 按钮 ---------- */
  button {
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    color: var(--ink-soft);
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    padding: 7px 14px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease, transform .08s ease, box-shadow .15s ease, color .15s ease;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1; vertical-align: middle;
  }
  button:hover { background: var(--raise); border-color: var(--accent); color: var(--ink); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-ink); font-weight: 600;
    box-shadow: 0 1px 2px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  button.primary:hover { background: color-mix(in srgb, var(--accent) 82%, black); border-color: color-mix(in srgb, var(--accent) 82%, black); color: var(--accent-ink); }
  button.danger { color: var(--red); border-color: var(--red-line); background: var(--red-soft); }
  button.danger:hover { background: color-mix(in srgb, var(--red-soft) 60%, var(--red) 16%); border-color: var(--red); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #refreshBtn { background: transparent; color: var(--muted); border-color: var(--line); font-family: var(--mono); font-size: 12px; padding: 6px 11px; letter-spacing: .04em; }
  #refreshBtn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  #themeBtn { padding: 6px 10px; font-size: 15px; line-height: 1; }

  /* ---------- 工作区 / 侧栏 ---------- */
  .workbench { flex: 1 1 auto; min-height: 0; display: flex; }
  .activitybar {
    flex: none; width: 88px;
    background: var(--bg-deep);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: stretch;
    padding: 12px 0;
  }
  .tabs { flex-direction: column; gap: 4px; padding: 0 10px; border: none; }
  .tabs button {
    background: transparent; border: 0; margin: 0;
    border-radius: var(--radius);
    color: var(--muted);
    padding: 13px 6px 11px;
    font-size: 11px; font-weight: 500;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    letter-spacing: .02em; position: relative;
    transition: background .15s ease, color .15s ease;
  }
  .tabs button::before { content: attr(data-icon); font-size: 18px; line-height: 1; font-family: var(--mono); }
  .tabs button:hover { background: var(--panel-2); color: var(--ink); }
  .tabs button.active { color: var(--ink); background: var(--accent-soft); }
  .tabs button.active::after { content: ""; position: absolute; left: -10px; top: 20%; bottom: 20%; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .tab-n {
    font-family: var(--mono); font-size: 10.5px;
    color: var(--faint); min-width: 18px; text-align: center;
    padding: 1px 5px; height: 16px; line-height: 14px;
    background: var(--panel-2); border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .tabs button.active .tab-n { color: var(--accent); background: var(--bg-deep); }

  .mainarea { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

  /* ---------- 概览卡片（默认隐藏，太占地方；如需恢复改 display:grid）---------- */
  .cards {
    flex: none; display: none; grid-template-columns: repeat(5, 1fr);
    background: var(--line); gap: 1px;
    border-bottom: 1px solid var(--line);
  }
  .card {
    padding: 18px 22px 19px;
    background: var(--panel);
    display: flex; flex-direction: column; gap: 4px;
    position: relative; transition: background .15s ease;
  }
  .card:hover { background: var(--raise); }
  .card .idx { font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; color: var(--faint); }
  .card .n {
    font-family: var(--disp); font-weight: 600;
    font-size: 32px; line-height: 1.05;
    font-variant-numeric: tabular-nums;
    color: var(--ink); letter-spacing: -.02em;
    font-variation-settings: "opsz" 144;
    margin: 3px 0 2px;
  }
  .card.green .n { color: var(--green); }
  .card.red .n { color: var(--red); }
  .card.amber .n { color: var(--amber-fill); }
  .card .t { font-size: 12.5px; color: var(--muted); }
  .card .en { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; color: var(--faint); margin-top: 3px; text-transform: uppercase; }
  /* ---------- 同步下发栏 ---------- */
  .syncbox {
    flex: none; background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 15px 24px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .sync-label { display: flex; align-items: baseline; gap: 10px; }
  .sync-label .lab-en { font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em; color: var(--amber); text-transform: uppercase; }
  .sync-label .lab-cn { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .sync-actions { display: flex; gap: 8px; }
  .syncbox .hint { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  .syncbox .hint code { font-family: var(--mono); color: var(--blue); font-size: 12px; background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }
  .syncbox .hint b { color: var(--amber); font-weight: 600; font-family: var(--mono); font-size: 12px; }
  .sync-scope { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .sync-scope b { color: var(--ink-soft); font-weight: 600; }
  .syncbox .sync-write { background: var(--panel-2); color: var(--ink); border-color: var(--line-strong); }
  .syncbox .sync-write:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  .tabs-hint { flex: none; padding: 9px 24px; background: var(--bg-deep); border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 1.6; color: var(--muted); }
  .page-summary { flex: none; display: flex; align-items: baseline; gap: 10px; padding: 10px 24px 8px; background: var(--panel); color: var(--ink-soft); border-bottom: 1px solid var(--line); }
  .page-summary strong { color: var(--ink); font-size: 15px; }
  .page-summary span { color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
  .page-summary .summary-alert { color: var(--amber); }
  .page-summary .summary-danger { color: var(--red); }
  .tabs-hint::before { content: "›"; color: var(--accent); margin-right: 8px; font-weight: 700; }

  /* ---------- 工具栏 ---------- */
  .toolbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .toolbar input[type="search"] {
    flex: 1; min-width: 0;
    font: 14px var(--mono); color: var(--ink);
    background: var(--bg-deep);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 9px 14px; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .toolbar input[type="search"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .toolbar select {
    font: 13px var(--mono); color: var(--ink-soft);
    background: var(--bg-deep);
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
    padding: 9px 12px; cursor: pointer;
  }
  .filter-info { font-family: var(--mono); font-size: 12px; color: var(--accent); }

  /* ---------- 面板 / 表格 ---------- */
  .panel { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--bg); }
  .tbl-wrap { padding: 0 0 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg-deep);
    color: var(--muted); font-weight: 600;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    text-align: left; padding: 12px 18px;
    border-bottom: 1px solid var(--line-strong);
  }
  tbody td { padding: 14px 18px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr strong { color: var(--ink); font-weight: 600; font-size: 14px; }
  .detail { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-top: 5px; }
  .detail.clamp1, .detail.clamp2 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  .detail.clamp1 { -webkit-line-clamp: 1; }
  .detail.clamp2 { -webkit-line-clamp: 2; }
  .secondary-detail { font-size: 11.5px; margin-top: 3px; }

  /* ---------- 徽章 / 状态药丸 ---------- */
  .badge {
    font-family: var(--mono); font-size: 11px;
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line);
    display: inline-block; letter-spacing: .02em; font-weight: 500;
  }
  .b-codex { color: var(--green); background: var(--green-soft); border-color: var(--green-line); }
  .b-claude { color: var(--amber); background: var(--amber-soft); border-color: var(--amber-line); }
  .b-workbuddy { color: var(--blue); background: var(--blue-soft); border-color: var(--blue-line); }
  .b-trae { color: var(--violet); background: var(--violet-soft); border-color: var(--violet-line); }
  .st {
    font-family: var(--mono); font-size: 11px;
    padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line);
    display: inline-block; white-space: nowrap; letter-spacing: .02em;
  }
  .st-managed-ok { color: var(--green); background: var(--green-soft); border-color: var(--green-line); }
  .st-synced-copy { color: var(--blue); background: var(--blue-soft); border-color: var(--blue-line); }
  .st-fork, .st-broken-link, .st-missing-target, .st-managed-foreign { color: var(--red); background: var(--red-soft); border-color: var(--red-line); }
  .st-missing-canonical, .st-bad-frontmatter { color: var(--amber); background: var(--amber-soft); border-color: var(--amber-line); }
  .st-unregistered, .st-duplicate { color: var(--blue); background: var(--blue-soft); border-color: var(--blue-line); }
  .st-ignored { color: var(--faint); background: transparent; border-color: var(--line); }
  .st-archived { color: var(--muted); background: var(--panel-2); border-color: var(--line); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .row-actions button { padding: 5px 11px; font-size: 12.5px; }
  .cell-badges { display: table-cell; vertical-align: middle; white-space: nowrap; }
  .cell-badges .badge { display: inline-block; margin: 0 4px 4px 0; vertical-align: middle; }

  /* ---------- 空态 / 提示 / 警告 ---------- */
  .empty { padding: 64px 24px; text-align: center; color: var(--muted); }
  .empty .glyph { font-size: 42px; color: var(--faint); margin-bottom: 14px; font-family: var(--disp); font-variation-settings: "opsz" 144; }
  .empty .et { font-size: 16px; color: var(--ink-soft); }
  .empty .es { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 7px; letter-spacing: .14em; }
  .meta-line { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 10px 24px; background: var(--bg-deep); border-bottom: 1px solid var(--line); }
  .warn { color: var(--red); font-family: var(--mono); font-size: 13px; padding: 12px 24px; background: var(--red-soft); border-left: 3px solid var(--red); }
  .muted { color: var(--muted); }

  /* ---------- 分页 ---------- */
  .pager-bar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 13px 24px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .pager-info b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
  .pager-size { font: 12.5px var(--mono); color: var(--ink-soft); background: var(--bg-deep); border: 1px solid var(--line); padding: 6px 9px; border-radius: var(--radius-sm); cursor: pointer; }
  .pager-pages { display: flex; gap: 4px; align-items: center; }
  .pg { padding: 6px 11px; font-size: 12.5px; font-family: var(--mono); background: var(--panel); border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer; border-radius: var(--radius-sm); transition: background .12s, border-color .12s, color .12s; }
  .pg:hover:not(.ellipsis) { border-color: var(--accent); color: var(--accent); }
  .pg.cur { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .pg.ellipsis { background: none; border: none; cursor: default; }
  .pg:disabled { opacity: .4; cursor: not-allowed; }

  /* ---------- 技能库卡片与视图控制 ---------- */
  .library-controls {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 0 30px 14px; border-bottom: 1px solid var(--line);
  }
  .library-filters, .library-view-switch { display: flex; align-items: center; gap: 6px; }
  .library-filter {
    min-height: 30px; padding: 6px 11px; color: var(--muted); background: transparent;
    border-color: transparent; font-size: 11px;
  }
  .library-filter:hover { color: var(--ink); border-color: var(--line); background: var(--panel); }
  .library-filter.active { color: var(--accent); border-color: var(--accent-line, var(--green-line)); background: var(--accent-soft); }
  .library-view-switch { padding: 3px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
  .library-view-switch button { width: 30px; height: 28px; padding: 0; border: 0; color: var(--muted); background: transparent; }
  .library-view-switch button.active { color: var(--accent); background: var(--accent-soft); }
  .library-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: 12px; padding: 2px 30px 24px;
  }
  .skill-card {
    min-width: 0; display: flex; flex-direction: column; padding: 17px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--panel);
    transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
  }
  .skill-card:hover { border-color: var(--line-strong); transform: translateY(-2px); box-shadow: var(--shadow); }
  .skill-card-head { display: flex; align-items: flex-start; gap: 11px; min-width: 0; }
  .skill-mark {
    width: 38px; height: 38px; flex: none; display: grid; place-items: center;
    border: 1px solid var(--green-line); border-radius: 8px; background: var(--green-soft);
    color: var(--green); font: 600 12px var(--mono); letter-spacing: -.04em;
  }
  .skill-card-title { min-width: 0; flex: 1; }
  .skill-card-title strong { display: block; overflow: hidden; color: var(--ink); font: 600 14px/1.35 var(--mono); text-overflow: ellipsis; white-space: nowrap; }
  .skill-card-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .skill-card-meta .st, .skill-card-meta .badge { font-size: 9px; }
  .skill-card-desc {
    display: -webkit-box; min-height: 40px; margin: 15px 0 13px; overflow: hidden;
    color: var(--muted); font-size: 12px; line-height: 1.65; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  }
  .skill-card-targets { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; min-height: 25px; margin-top: auto; }
  .skill-card-target-label { margin-right: 2px; color: var(--faint); font: 9px var(--mono); letter-spacing: .08em; }
  .skill-card-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); }
  .skill-card-actions .row-actions { gap: 5px; }
  .skill-card-actions button { padding: 6px 9px; font-size: 11px; }
  .library-list { padding: 0 30px 20px; }
  .library-list .tbl-wrap { padding: 0; }
  .library-list tbody td { background: var(--panel); }
  .library-list tbody tr td:first-child { border-left: 1px solid var(--line); }
  .library-list tbody tr td:last-child { border-right: 1px solid var(--line); }
  .library-list tbody tr:first-child td:first-child { border-top-left-radius: 6px; }
  .library-list tbody tr:first-child td:last-child { border-top-right-radius: 6px; }
  @media (max-width: 860px) {
    .library-controls { padding-inline: 20px; }
    .library-grid, .library-list { padding-left: 20px; padding-right: 20px; }
  }
  @media (max-width: 720px) {
    .library-controls { align-items: flex-start; padding: 0 16px 11px; }
    .library-filters { flex-wrap: wrap; gap: 3px; }
    .library-filter { padding-inline: 8px; }
    .library-grid, .library-list { padding-left: 16px; padding-right: 16px; }
  }
  @media (max-width: 460px) {
    .library-controls { gap: 6px; }
    .library-view-switch { flex: none; }
    .library-grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .skill-card { transition: none; }
    .skill-card:hover { transform: none; }
  }

  /* ---------- 状态栏 ---------- */
  .statusbar { flex: none; min-height: 32px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; padding: 0 20px; gap: 14px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em; }
  :where(button, input, select, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #toasts { pointer-events: none; }
  #toasts .toast { pointer-events: auto; }
  .statusbar .sep { opacity: .38; }
  .statusbar .sb-right { margin-left: auto; display: flex; gap: 12px; opacity: .92; }
  /* ---------- 模态框 ---------- */
  .modal-mask { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 50%, transparent); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); z-index: 100; display: none; align-items: center; justify-content: center; }
  .modal-mask.show { display: flex; animation: fadein .18s ease; }
  .modal {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); width: min(720px, 92vw); max-height: 86vh;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg);
    animation: modalin .24s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalin { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
  .modal h3 { margin: 0; padding: 17px 24px; font-size: 15.5px; font-weight: 600; border-bottom: 1px solid var(--line); color: var(--ink); }
  .modal .body { padding: 20px 24px; overflow: auto; flex: 1; min-height: 0; }
  .modal .foot { padding: 15px 24px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; background: var(--panel-2); border-radius: 0 0 var(--radius) var(--radius); }
  .modal input[type="text"], .modal input:not([type]) { font: 14px var(--mono); color: var(--ink); background: var(--bg-deep); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 13px; outline: none; width: 100%; transition: border-color .15s ease, box-shadow .15s ease; }
  .modal input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ck { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink-soft); margin-right: 16px; cursor: pointer; }
  .ck input { accent-color: var(--accent); width: 16px; height: 16px; }

  /* ---------- Markdown 正文 ---------- */
  .md-body { font-size: 14.5px; line-height: 1.75; color: var(--ink-soft); }
  .md-body h1, .md-body h2, .md-body h3 { color: var(--ink); margin: 18px 0 10px; font-family: var(--disp); font-weight: 600; letter-spacing: -.01em; }
  .md-body h1 { font-size: 23px; }
  .md-body h2 { font-size: 18px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .md-body code { font-family: var(--mono); background: var(--panel-2); padding: 1px 6px; border-radius: 4px; font-size: 12.5px; color: var(--amber); }
  .md-body pre { background: var(--bg-deep); padding: 13px; border-radius: var(--radius-sm); overflow: auto; border: 1px solid var(--line); }
  .md-body pre code { background: none; padding: 0; color: var(--ink-soft); font-size: 12.5px; }
  .md-body blockquote { border-left: 3px solid var(--accent); margin: 10px 0; padding: 7px 15px; color: var(--muted); background: var(--accent-soft); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .md-body table { border-collapse: collapse; margin: 10px 0; }
  .md-body th, .md-body td { border: 1px solid var(--line); padding: 7px 13px; }
  .md-body th { background: var(--panel-2); }
  .md-fm summary { font-family: var(--mono); font-size: 12px; color: var(--accent); cursor: pointer; letter-spacing: .04em; }
  .md-fm pre { margin: 8px 0; font-size: 12px; }
  .view-toggle { float: right; display: flex; gap: 4px; }
  .view-toggle button { padding: 4px 11px; font-size: 12px; }
  .view-toggle button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .skill-view { font-family: var(--mono); font-size: 13px; line-height: 1.65; white-space: pre-wrap; background: var(--bg-deep); padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--line); }
  .diff-add { color: var(--green); }
  .diff-del { color: var(--red); }
  .diff-hunk { color: var(--violet); }
  .cmp-tbl th, .cmp-tbl td { font-size: 12.5px; padding: 7px 11px; }
  .cmp-diff summary { font-family: var(--mono); font-size: 12.5px; color: var(--accent); cursor: pointer; margin: 11px 0 6px; }
  .out { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; background: var(--bg-deep); padding: 13px; border-radius: var(--radius-sm); border: 1px solid var(--line); overflow: auto; max-height: 320px; white-space: pre-wrap; }
  .hist-time { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  /* ---------- Toast ---------- */
  #toasts { position: fixed; bottom: 40px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 9px; }
  .toast { background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 12px 18px; font-size: 13.5px; color: var(--ink); box-shadow: var(--shadow); animation: slidein .25s ease; }
  .toast.ok { border-left: 3px solid var(--green); }
  .toast.err { border-left: 3px solid var(--red); }
  @keyframes slidein { from { transform: translateX(26px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* ---------- 卡片错落入场 ---------- */
  .card { animation: cardin .42s cubic-bezier(.2,.7,.3,1) backwards; }
  .card:nth-child(1) { animation-delay: .04s; }
  .card:nth-child(2) { animation-delay: .08s; }
  .card:nth-child(3) { animation-delay: .12s; }
  .card:nth-child(4) { animation-delay: .16s; }
  .card:nth-child(5) { animation-delay: .20s; }
  @keyframes cardin { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  /* ---------- 响应式 ---------- */
  @media (max-width: 860px) {

    .syncbox { align-items: flex-start; padding-top: 13px; padding-bottom: 13px; gap: 10px 14px; }
    .sync-label { flex: 1 1 100%; }
    .sync-actions { flex: 1 1 auto; }
    .sync-scope, .syncbox .hint { flex: 1 1 100%; margin-left: 0; white-space: normal; }
    .toolbar { display: grid; grid-template-columns: 1fr auto; padding-top: 10px; padding-bottom: 10px; }
    .toolbar input[type="search"] { grid-column: 1 / -1; width: 100%; }
    .toolbar select { min-width: 0; width: 100%; }
    .toolbar #importBtn, .toolbar #clearFilter { width: 100%; }
    .panel { overflow-x: auto; }
    table { min-width: 680px; }
    .statusbar { padding: 0 12px; gap: 8px; font-size: 10px; overflow: hidden; white-space: nowrap; }
    .statusbar > .sep, .statusbar > span:nth-child(3), .statusbar > span:nth-child(4), .sb-right { display: none; }
    #toasts { left: 12px; right: 12px; bottom: 42px; }
  }
  @media (max-width: 460px) {
    .activitybar { width: 52px; }
    .tabs { padding: 0 3px; }
    .sync-actions { width: 100%; }
    .sync-actions button { flex: 1; }
    .toolbar { grid-template-columns: 1fr; }
    .toolbar #importBtn, .toolbar #clearFilter { grid-column: auto; }
    table { min-width: 620px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* Skill Hub / night operations desk */
  :root {
    --bg: #101512;
    --bg-deep: #0b100d;
    --panel: #151d18;
    --panel-2: #1b2620;
    --raise: #202d26;

    --ink-soft: #bac8bd;
    --muted: #84958a;

    --line-strong: #35483b;

<script>
"use strict";
// 主题：亮色默认，暗色通过 body.light 切换；偏好存 localStorage
function applyTheme(t) {
  const isLight = t === "light";
  document.body.classList.toggle("light", isLight);
  const btn = document.getElementById("themeBtn");
  if (btn) {
    btn.textContent = isLight ? "☾" : "☀";
    btn.setAttribute("aria-pressed", String(!isLight));
    btn.setAttribute("aria-label", isLight ? "切换到暗色主题" : "切换到亮色主题");
  }
}
function toggleTheme() {
  const cur = document.body.classList.contains("light") ? "light" : "dark";
  const next = cur === "light" ? "dark" : "light";
  localStorage.setItem("skillsync-theme", next);
  applyTheme(next);
}
applyTheme(localStorage.getItem("skillsync-theme") || "light");

// 平台清单：首屏用内置默认，/api/scan 返回后按生效配置覆盖（自定义平台无需改前端）
const KNOWN_BADGE = new Set(["codex", "claude", "workbuddy", "trae"]);
let PLATFORMS = ["codex", "claude", "workbuddy", "trae"];
let PLATFORM_LABELS = {};
// 自定义平台徽章配色：按配置顺序分配，与四个内置平台色板错开
const EXTRA_BADGE = [
  ["#0f766e", "#e6f5f3", "#b2ddd8"], ["#0e6fa8", "#e7f3fb", "#b5d9ee"],
  ["#4f46a5", "#ececfb", "#c9c6ec"], ["#be4b5e", "#fdeef0", "#f3c6ce"],
  ["#4d7c0f", "#f1f8e3", "#d3e7a8"], ["#b45309", "#fdf0e3", "#f0cfa3"],
  ["#475569", "#eef1f5", "#c7d0db"], ["#0d8a8a", "#e4f7f4", "#aedcd4"],
];
let BADGE_STYLE = {};
const PLATFORM_SOURCE_TEXT = {
  "default": "内置默认（codex / claude / workbuddy / trae）",
  "repo": "仓库配置 registry/platforms.yaml",
  "user": "个人配置 ~/.skillsync/platforms.yaml",
  "env": "环境变量 SKILLSYNC_PLATFORMS",
};

// 按后端返回的生效平台重建筛选下拉与徽章配色；选中项消失时安全回退到「全部平台」
function syncPlatforms(list, source) {
  if (Array.isArray(list) && list.length) {
    PLATFORMS = list.map(p => p.key);
    PLATFORM_LABELS = {};
    for (const p of list) PLATFORM_LABELS[p.key] = p.label || p.key;
  }
  BADGE_STYLE = {};
  let ei = 0;
  for (const p of PLATFORMS) {
    if (!KNOWN_BADGE.has(p)) BADGE_STYLE[p] = EXTRA_BADGE[ei++ % EXTRA_BADGE.length];
  }
  const sel = $("#platformSel");
  const prev = sel.value || "all";
  sel.innerHTML = `<option value="all">全部平台</option>` + PLATFORMS.map(p =>
    `<option value="${p}">${PLATFORM_LABELS[p] && PLATFORM_LABELS[p] !== p
      ? esc(PLATFORM_LABELS[p]) + " · " + p : p}</option>`).join("");
  if (prev === "all" || PLATFORM_LABELS[prev]) {
    sel.value = prev;
  } else {
    sel.value = "all";
    platformFilter = "all";
  }
  sel.title = "平台清单来源：" + (PLATFORM_SOURCE_TEXT[source] || source || "内置默认");
}
const PROBLEM_STATUSES = ["fork", "broken-link", "missing-target", "managed-foreign", "missing-canonical", "bad-frontmatter"];
const PAGE_SIZES = [15, 30, 50];
const STATUS_TEXT = {
  "managed-ok": "已纳管（软链）", "synced-copy": "内容一致副本", "fork": "已分叉",
  "unregistered": "未登记", "duplicate": "内容重复", "missing-target": "平台缺失",
  "managed-foreign": "仓外软链", "broken-link": "软链失效",
  "missing-canonical": "缺 canonical", "bad-frontmatter": "元数据异常", "ignored": "已忽略"
};
let DATA = null;
let libraryFilter = "all";
let libraryView = localStorage.getItem("skillsync-library-view") === "list" ? "list" : "cards";
// 归档集合：catalog.archived 的技能（其异常/待采纳行不催办，可在技能库恢复）
const ARCH = () => new Set((DATA && DATA.archived) || []);
let pageSize = 15;
const pagePos = { pending: 1, problems: 1, managed: 1, library: 1, history: 1 };

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));
const jstr = v => JSON.stringify(v).replace(/[<>'&]/g, c => ({"<":"&lt;",">":"&gt;","'":"&#39;","&":"&amp;"}[c])).replace(/"/g, "&quot;");

function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.setAttribute("role", kind === "err" ? "alert" : "status");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json();
  if (!data.ok && res.status >= 400 && path.startsWith("/api/") && !path.includes("/scan")) {
    const err = new Error(data.error || ("HTTP " + res.status));
    if (data.code) err.code = data.code;  // 供调用方区分「能力缺失」与「真实故障」
    throw err;
  }
  return data;
}

async function refresh() {
  const d = await api("/api/scan");
  DATA = d;
  syncPlatforms(d.platforms, d.platforms_source);
  HISTORY = null; // 操作可能已写入新审计记录，缓存失效
  render();
  $("#lastScan").textContent = "SCAN " + new Date().toLocaleTimeString();
  try { watchSig = (await api("/api/poll")).sig; } catch (_) {}
}

// ---- watch 自动扫描：轮询目录签名，变化即重扫（只读，不自动改任何东西） ----
let watchSig = null;
async function watchTick() {
  try {
    const d = await api("/api/poll");
    if (watchSig !== null && d.sig !== watchSig) {
      await refresh(); // refresh() 末尾会更新 watchSig 基线
      toast("检测到技能目录变化，已自动重新扫描", "ok");
      return;
    }
    watchSig = d.sig;
  } catch (_) { /* 服务短暂不可用，下轮再试 */ }
}
setInterval(watchTick, 5000);

function groupByStatus() {
  const g = {};
  for (const f of DATA.findings) (g[f.status] ||= []).push(f);
  return g;
}

function renderCards() {
  const s = DATA.summary;
  const cards = [
    ["canonical 技能", DATA.canonical_count, "", "CANONICAL"],
    ["已纳管软链", s["managed-ok"] || 0, "green", "LINKED"],
    ["需处理问题", DATA.problem_total, DATA.problem_total ? "red" : "", "SIGNALS"],
    ["可采纳 / 转链", (s["unregistered"] || 0) + (s["duplicate"] || 0) + (s["synced-copy"] || 0), "amber", "PENDING"],
    ["平台内置（跳过）", DATA.builtin_counts ? Object.values(DATA.builtin_counts).reduce((a, b) => a + b, 0) : 0, "", "BUILT-IN"]
  ];
  $("#cards").innerHTML = cards.map((c, i) =>
    `<div class="card ${c[2]}"><div class="idx">0${i + 1}/05</div><div class="n">${c[1]}</div><div class="t">${c[0]}</div><div class="en">${c[3]}</div></div>`
  ).join("");
  const repoPath = String(DATA.repo_root || "");
  const repoName = repoPath.split(/[\\/]/).filter(Boolean).pop() || "本地技能仓";
  $("#repo").innerHTML = `<span class="pulse"></span>${esc(repoName)}`;
  $("#repo").title = repoPath;
  $("#sbRepo").textContent = repoName;
  const targetCount = Number(DATA.catalog_target_count || 0);
  $("#applyScope").innerHTML = `预计检查 <b>${targetCount}</b> 个技能目标`;
  $("#applyWriteLink").title = targetCount ? `执行下发：检查 ${targetCount} 个技能目标` : "执行下发：当前没有已登记技能";
  const la = DATA.state?.last_apply;
  $("#lastApply").textContent = la?.time ? `${la.time}（变更 ${la.changed ?? "?"}）` : "无";
}

function updatePageSummary(tab, counts) {
  const labels = { library: "技能库", pending: "待采纳", problems: "问题", managed: "纳管", history: "历史" };
  const parts = [`<strong>${labels[tab] || "当前视图"}</strong>`];
  if (tab === "pending") parts.push(`<span class="summary-alert">${counts.pending} 条待处理</span>`);
  else if (tab === "problems") parts.push(`<span class="summary-danger">${counts.problems} 个异常</span>`);
  else if (tab === "managed") parts.push(`<span>${counts.managed} 条记录</span>`);
  else if (tab === "library") parts.push(`<span>${counts.library} 个 canonical 技能</span>`);
  else if (tab === "history") parts.push(`<span>${counts.history || 0} 条审计记录</span>`);
  if (tab !== "history" && counts.pending && counts.problems) {
    parts.push(`<span>待采纳 ${counts.pending} · 问题 ${counts.problems}</span>`);
  }
  $("#pageSummary").innerHTML = parts.join("");
}

function renderTabCounts(g, counts) {
  $("#cnt-pending").textContent = counts.pending;
  $("#cnt-problems").textContent = counts.problems;
  $("#cnt-managed").textContent = counts.managed;
  $("#cnt-library").textContent = counts.library;
}

function badge(p) {
  if (KNOWN_BADGE.has(p)) return `<span class="badge b-${p}">${p}</span>`;
  const c = BADGE_STYLE[p] || EXTRA_BADGE[0];
  const tip = PLATFORM_LABELS[p] ? ` title="${esc(PLATFORM_LABELS[p])}"` : "";
  return `<span class="badge"${tip} style="color:${c[0]};background:${c[1]};border-color:${c[2]}">${p}</span>`;
}
function stCell(f) { return `<span class="st st-${f.status}">${STATUS_TEXT[f.status] || f.status}</span>`; }
function emptyBlock(glyph, text, sub) {
  return `<div class="empty"><div class="glyph">${glyph}</div><div class="et">${text}</div><div class="es">${sub}</div></div>`;
}

// ---- 分页：唯一一套切片逻辑 ----
function pageSlice(rows, tab) {
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (pagePos[tab] > pages) pagePos[tab] = pages;
  if (pagePos[tab] < 1) pagePos[tab] = 1;
  const page = pagePos[tab];
  const start = (page - 1) * pageSize;
  return { items: rows.slice(start, start + pageSize), total, pages, page };
}

function pageNumbers(page, pages) {
  const out = [];
  const push = n => out.push(n);
  if (pages <= 7) { for (let i = 1; i <= pages; i++) push(i); return out; }
  push(1);
  if (page > 3) out.push("…");
  for (let i = Math.max(2, page - 1); i <= Math.min(pages - 1, page + 1); i++) push(i);
  if (page < pages - 2) out.push("…");
  push(pages);
  return out;
}

function pagerBar(tab, info) {
  const { total, pages, page } = info;
  if (!total) return "";
  const sizeSel = PAGE_SIZES.map(n =>
    `<option value="${n}" ${n === pageSize ? "selected" : ""}>${n} 条/页</option>`).join("");
  let pagesHtml = "";
  if (pages > 1) {
    pagesHtml = `<div class="pager-pages">
      <button class="pg" ${page === 1 ? "disabled" : ""} onclick="goPage('${tab}', ${page - 1})">‹</button>
      ${pageNumbers(page, pages).map(n => n === "…"
        ? `<span class="pg ellipsis">…</span>`
        : `<button class="pg ${n === page ? "cur" : ""}" onclick="goPage('${tab}', ${n})">${n}</button>`).join("")}
      <button class="pg" ${page === pages ? "disabled" : ""} onclick="goPage('${tab}', ${page + 1})">›</button>
    </div>`;
  }
  return `<div class="pager-bar">
    <span class="pager-info">共 <b>${total}</b> 条 · 第 <b>${page}</b> / ${pages} 页</span>
    <select class="pager-size" onchange="setPageSize(this.value)" aria-label="每页条数">${sizeSel}</select>
    ${pagesHtml}
  </div>`;
}

window.goPage = function (tab, n) {
  pagePos[tab] = n;
  render();
};
window.setPageSize = function (v) {
  pageSize = Number(v);
  for (const k of Object.keys(pagePos)) pagePos[k] = 1;
  render();
};

// ---- 搜索筛选 ----
let query = "";
let platformFilter = "all";

const curTab = () => $("#tabs button.active").dataset.tab;
const filtersActive = () => !!(query || platformFilter !== "all");

window.onSearch = function (v) {
  query = v.trim().toLowerCase();
  pagePos[curTab()] = 1;
  render();
};
window.onPlatform = function (v) {
  platformFilter = v;
  pagePos[curTab()] = 1;
  render();
};
window.clearFilters = function () {
  query = ""; platformFilter = "all"; libraryFilter = "all";
  $("#searchBox").value = ""; $("#platformSel").value = "all";
  render();
};

// 平台行匹配：missing-canonical 等无平台行的 platform 为 "-"，不受平台筛选限制
function matchRow(f) {
  if (platformFilter !== "all" && f.platform !== "-" && f.platform !== platformFilter) return false;
  if (!query) return true;
  const hay = [f.name, f.detail || "", rowDesc(f), f.platform || ""].join(" ").toLowerCase();
  return query.split(/\s+/).every(t => hay.includes(t));
}

function render() {
  const tab = curTab();
  $("#libraryControls").hidden = tab !== "library";
  if (tab === "history") { renderCards(); renderHistoryTab(); return; }
  const g = groupByStatus();
  renderCards();
  // 归档语义：已归档技能的待采纳/问题行不再显示（计入 hiddenN，可在技能库恢复）
  const pendAll = [...(g["unregistered"] || []), ...(g["duplicate"] || []), ...(g["synced-copy"] || [])];
  const probAll = [];
  for (const st of PROBLEM_STATUSES) probAll.push(...(g[st] || []));
  const pendingRows = pendAll.filter(f => !f.archived);
  const problemRows = probAll.filter(f => !f.archived);
  const pendHidden = pendAll.length - pendingRows.length;
  const probHidden = probAll.length - problemRows.length;
  const managedRows = [...(g["managed-ok"] || []), ...(g["ignored"] || [])];
  const allLib = libraryRows();
  const pend = pendingRows.filter(matchRow);
  const prob = problemRows.filter(matchRow);
  const man = managedRows.filter(matchRow);
  const lib = allLib.filter(matchLibraryRow).filter(matchesLibraryFilter);
  const tabCounts = {
    pending: pendingRows.length, problems: problemRows.length,
    managed: managedRows.length, library: allLib.length
  };
  renderTabCounts(g, tabCounts);
  updatePageSummary(tab, tabCounts);
  // 筛选提示：页签计数保持全量，这里显示当前页签的匹配数
  const totals = { pending: pendingRows.length, problems: problemRows.length,
                   managed: managedRows.length, library: allLib.length };
  const shown = { pending: pend, problems: prob, managed: man, library: lib }[tab];
  const libraryFilterActive = tab === "library" && libraryFilter !== "all";
  const activeFilters = filtersActive() || libraryFilterActive;
  $("#filterInfo").textContent =
    activeFilters ? `FILTER ${shown.length} / ${totals[tab]}` : "";
  $("#clearFilter").style.display = activeFilters ? "" : "none";
  // 有数据但被筛没：显示筛选空态（与真正无数据的空态区分）
  if (activeFilters && !shown.length && totals[tab]) {
    $("#panel").innerHTML = `<div class="empty"><div class="glyph">⌕</div>
      <div class="et">没有匹配的技能</div>
      <div class="es">调整关键词或平台筛选，或 <button onclick="clearFilters()">清除筛选</button></div></div>`;
    return;
  }
  if (tab === "pending") { renderPending(pend, pendHidden); pretranslateDescs(); }
  else if (tab === "problems") renderProblems(prob, probHidden);
  else if (tab === "managed") renderManaged(man);
  else renderLibrary(lib);
}

// 行简介：优先平台侧 description（未采纳技能），其次 canonical 的
function rowDesc(f) {
  return (DATA.platform_descriptions || {})[f.platform + "/" + f.name]
      || (DATA.descriptions || {})[f.name] || "";
}
const GENERIC_PENDING_DETAIL = "平台目录中的新技能，尚未纳入共享仓";

// ---- 简介批量预翻译：进入待采纳页后，后台把英文简介逐条译中 ----
// 译文进程内即时生效；后端 /api/translate 自带磁盘缓存，重启不丢。
const DESC_ZH = new Map();  // 英文简介 -> 中文译文
const DOC_TR = new Map();   // 查看器自动预热：SKILL.md 原文 -> 翻译 promise
// 待译集合每次按「尚无译文且未失败」重算，因此后续刷新出现的新英文简介会继续被翻译
const PRETRANS = { running: false, paused: false, off: false, failed: new Set(), done: 0, total: 0 };
let _pretransPainted = 0;

function paintPretransChip() {
  const c = $("#pretransChip");
  if (!c) return;
  if (PRETRANS.running) {
    c.hidden = false;
    c.innerHTML = `<span class="pulse"></span>简介译中 ${PRETRANS.done}/${PRETRANS.total}`
      + (PRETRANS.paused ? "（已暂停，详情优先）" : "");
  } else {
    c.hidden = true;
  }
}

async function pretranslateDescs() {
  if (PRETRANS.running || PRETRANS.off) return;
  const g = groupByStatus();
  const pendRows = [...(g["unregistered"] || []), ...(g["duplicate"] || []), ...(g["synced-copy"] || [])];
  const uniq = [...new Set(pendRows.map(rowDesc).filter(Boolean))]
    .filter(d => isMostlyEnglish(d) && !DESC_ZH.has(d) && !PRETRANS.failed.has(d));
  if (!uniq.length) return;
  PRETRANS.running = true; PRETRANS.done = 0; PRETRANS.total = uniq.length;
  paintPretransChip();
  let aborted = "";
  for (const d of uniq) {
    // 详情查看器打开时让路：离线翻译引擎单线程，交互请求优先
    while (PRETRANS.paused) await new Promise(r => setTimeout(r, 250));
    try {
      const r = await api("/api/translate", { method: "POST", body: { text: d } });
      DESC_ZH.set(d, r.translated || d);
    } catch (e) {
      // 引擎缺失属预期情况：静默关掉批量预翻译（点「译为中文」时仍会明确报错）；
      // 失败的简介记入 failed，避免 render → 重试 形成死循环
      if (e.code === "no-translate-engine") PRETRANS.off = true;
      else aborted = e.message;
      PRETRANS.failed.add(d);
      break;
    }
    PRETRANS.done++;
    paintPretransChip();
    const now = Date.now();
    if (curTab() === "pending" && now - _pretransPainted > 400) {
      _pretransPainted = now;
      render();  // 译文到一条刷一屏（节流），列表逐步变中文
    }
  }
  PRETRANS.running = false;
  paintPretransChip();
  if (aborted) toast("批量预翻译中止：" + aborted, "err");
  else if (!PRETRANS.off && PRETRANS.done >= PRETRANS.total)
    toast(`英文简介已批量译好（${PRETRANS.done} 条，缓存已落盘）`, "ok");
  if (curTab() === "pending") render();
}

function renderPending(rows, hiddenN = 0) {
  const hint = hiddenN > 0
    ? `<div class="meta-line">另有 ${hiddenN} 条已归档技能的记录未显示（可在技能库恢复）</div>` : "";
  if (!rows.length) {
    $("#panel").innerHTML = hint || emptyBlock("———", "没有待采纳的技能", "NO PENDING SIGNALS");
    return;
  }
  const pg = pageSlice(rows, "pending");
  $("#panel").innerHTML = hint + `<div class="tbl-wrap"><table class="pending-table"><thead><tr>
    <th style="width:96px">平台 / PLATFORM</th><th>技能 / SKILL</th><th style="width:230px">操作 / ACTIONS</th>
    </tr></thead><tbody>${pg.items.map(f => {
      const desc = rowDesc(f);
      const shown = DESC_ZH.get(desc) || desc;
      const statusLine = f.detail === GENERIC_PENDING_DETAIL ? "" :
        `<div class="detail secondary-detail">${esc(f.detail)}</div>`;
      return `<tr>
      <td>${badge(f.platform)}</td>
      <td><strong>${esc(f.name)}</strong>${desc ? `<div class="detail clamp1" title="${esc(desc)}">${esc(shown)}</div>` : ""}${statusLine}</td>
      <td><div class="row-actions">
        <button onclick="viewSource('${f.platform}', ${jstr(f.name)})">查看</button>
        <button class="primary" onclick="openAdopt('${f.platform}', ${jstr(f.name)})">采纳…</button>
        <button onclick="ignoreOne('${f.platform}', ${jstr(f.name)})">忽略</button>
      </div></td></tr>`;}).join("")}</tbody></table></div>${pagerBar("pending", pg)}`;
}

function renderProblems(rows, hiddenN = 0) {
  const hint = hiddenN > 0
    ? `<div class="meta-line">另有 ${hiddenN} 条已归档技能的异常未显示（可在技能库恢复）</div>` : "";
  if (!rows.length) { $("#panel").innerHTML = hint || emptyBlock("✓", "没有需要处理的问题", "ALL SYSTEMS NOMINAL"); return; }
  const pg = pageSlice(rows, "problems");
  $("#panel").innerHTML = hint + `<div class="tbl-wrap"><table class="problem-table"><thead><tr>
    <th style="width:96px">平台 / PLATFORM</th><th>技能 / SKILL</th><th style="width:120px">状态 / STATUS</th><th style="width:260px">操作 / ACTIONS</th>
    </tr></thead><tbody>${pg.items.map(f => `<tr>
      <td>${f.platform === "-" ? "" : badge(f.platform)}</td>
      <td><strong>${esc(f.name)}</strong><div class="detail">${esc(f.detail)}</div></td>
      <td>${stCell(f)}</td>
      <td><div class="row-actions">${problemActions(f)}</div></td></tr>`).join("")}</tbody></table></div>${pagerBar("problems", pg)}`;
}

function problemActions(f) {
  const nm = jstr(f.name);
  if (f.status === "fork")
    return `<button class="primary" onclick="openCompare('${f.platform}', ${nm})">对比 · 拉取更新</button>
      <button onclick="resolveOne('${f.platform}', ${nm}, 'canonical')">以仓为准</button>`;
  if (f.status === "broken-link" || f.status === "missing-target")
    return `<button class="primary" onclick="applyOnly('${f.platform}', ${nm})">apply 修复</button>`;
  if (f.status === "managed-foreign")
    return `<button class="danger" onclick="applyForce('${f.platform}', ${nm})">强制换链</button>`;
  if (f.status === "bad-frontmatter")
    return f.platform === "-"
      ? `<button onclick="viewSkill(${nm})">查看</button>`
      : `<button onclick="viewSource('${f.platform}', ${nm})">查看</button>`;
  return "";
}

function renderManaged(rows) {
  if (!rows.length) { $("#panel").innerHTML = emptyBlock("———", "暂无已纳管技能", "NOTHING LINKED"); return; }
  const pg = pageSlice(rows, "managed");
  $("#panel").innerHTML = `<div class="tbl-wrap"><table class="managed-table"><thead><tr>
    <th style="width:96px">平台 / PLATFORM</th><th>技能 / SKILL</th><th style="width:170px">状态 / STATUS</th>
    </tr></thead><tbody>${pg.items.map(f => f.status === "ignored" ? `<tr>
      <td>${badge(f.platform)}</td>
      <td><strong>${esc(f.name)}</strong> <span class="st st-ignored">已忽略</span>
      <div class="row-actions" style="margin-top:5px"><button onclick="unignoreOne('${f.platform}', ${jstr(f.name)})">取消忽略</button></div></td>
      <td></td></tr>` : `<tr>
      <td>${badge(f.platform)}</td><td><strong>${esc(f.name)}</strong>${f.archived ? ` <span class="st st-archived">已归档</span>` : ""}
      ${(() => { const d = rowDesc(f); return d ? `<div class="detail clamp2" title="${esc(d)}">${esc(d)}</div>` : ""; })()}
      <div class="detail">${esc(f.detail)}</div></td><td>${stCell(f)}</td></tr>`).join("")}</tbody></table></div>${pagerBar("managed", pg)}`;
}

// 技能库行构建（render 与 renderLibrary 共用）
// 行源 = catalog 登记的 canonical 技能 ∪ 已纳管软链：导入或手工放进 skills/ 但尚未下发的
// 技能也要能在技能库看到，否则它们在任何页签都不出现。
function libraryRows() {
  const okFinds = DATA.findings.filter(f => f.status === "managed-ok");
  const platsOf = slug => [...new Set(okFinds.filter(f => f.name === slug).map(f => f.platform))];
  const registered = new Set(DATA.catalog_slugs || []);
  const canonical = new Set(Object.keys(DATA.descriptions || {}));
  const slugs = new Set(okFinds.map(f => f.name));
  for (const slug of canonical) slugs.add(slug);
  return [...slugs].sort().map(slug =>
    ({ slug, plats: platsOf(slug), desc: (DATA.descriptions || {})[slug] || "",
       archived: ARCH().has(slug), registered: registered.has(slug) }));
}

// 技能库行匹配：平台筛选按"已下发平台"判断
function matchLibraryRow(r) {
  if (platformFilter !== "all" && !r.plats.includes(platformFilter)) return false;
  if (!query) return true;
  const hay = [r.slug, r.desc, r.plats.join(" ")].join(" ").toLowerCase();
  return query.split(/\s+/).every(t => hay.includes(t));
}

function matchesLibraryFilter(r) {
  if (libraryFilter === "registered") return r.registered && !r.archived;
  if (libraryFilter === "unregistered") return !r.registered;
  if (libraryFilter === "archived") return r.archived;
  return true;
}

function syncLibraryControls() {
  document.querySelectorAll("[data-library-filter]").forEach(button => {
    const active = button.dataset.libraryFilter === libraryFilter;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
  const cards = libraryView === "cards";
  $("#libraryCardsBtn").classList.toggle("active", cards);
  $("#libraryListBtn").classList.toggle("active", !cards);
  $("#libraryCardsBtn").setAttribute("aria-pressed", String(cards));
  $("#libraryListBtn").setAttribute("aria-pressed", String(!cards));
}

function setLibraryView(view) {
  libraryView = view === "list" ? "list" : "cards";
  localStorage.setItem("skillsync-library-view", libraryView);
  render();
}

function renderLibrary(rows) {
  syncLibraryControls();
  if (!rows.length) {
    const filtered = libraryFilter !== "all" || filtersActive();
    $("#panel").innerHTML = filtered
      ? `<div class="empty"><div class="glyph">⌕</div><div class="et">没有匹配的技能</div><div class="es">调整筛选条件，或 <button onclick="clearFilters()">清除筛选</button></div></div>`
      : emptyBlock("———", "技能库为空", "CANONICAL EMPTY");
    return;
  }
  const pg = pageSlice(rows, "library");
  if (libraryView === "cards") {
    $("#panel").innerHTML = `<div class="library-grid">${pg.items.map(r => {
      const mark = esc(r.slug.replace(/[^a-z0-9]/gi, "").slice(0, 2).toUpperCase() || "SK");
      const state = r.archived ? `<span class="st st-archived">已归档</span>`
        : r.registered ? `<span class="st st-managed-ok">已登记</span>`
        : `<span class="st st-unregistered">未登记 catalog</span>`;
      const targets = r.plats.length ? r.plats.map(badge).join("")
        : `<span class="muted" style="font-size:11px">尚未下发</span>`;
      return `<article class="skill-card">
        <div class="skill-card-head"><span class="skill-mark" aria-hidden="true">${mark}</span>
          <div class="skill-card-title"><strong title="${esc(r.slug)}">${esc(r.slug)}</strong><div class="skill-card-meta">${state}</div></div>
        </div>
        <div class="skill-card-desc" title="${esc(r.desc || "暂无简介")}">${esc(r.desc || "暂无简介")}</div>
        <div class="skill-card-targets"><span class="skill-card-target-label">TARGETS</span>${targets}</div>
        <div class="skill-card-actions"><span class="muted" style="font:9px var(--mono)">CANONICAL</span>
          <div class="row-actions"><button onclick="viewSkill(${jstr(r.slug)})">查看详情</button>${r.registered
            ? (r.archived
              ? `<button onclick="archiveOne(${jstr(r.slug)}, false)">恢复</button>`
              : `<button onclick="archiveOne(${jstr(r.slug)}, true)">归档</button>`)
            : ""}</div>
        </div>
      </article>`;
    }).join("")}</div>${pagerBar("library", pg)}`;
    return;
  }
  $("#panel").innerHTML = `<div class="library-list"><div class="tbl-wrap"><table class="library-table"><thead><tr><th>技能 / SLUG</th><th>已下发平台 / TARGETS</th><th style="width:150px"></th></tr></thead>
    <tbody>${pg.items.map(r => `<tr><td><strong>${esc(r.slug)}</strong>${r.archived ? ` <span class="st st-archived">已归档</span>` : ""}${!r.registered ? ` <span class="st st-unregistered">未登记</span>` : ""}${r.desc ? `<div class="detail clamp2" title="${esc(r.desc)}">${esc(r.desc)}</div>` : ""}</td><td class="cell-badges">${r.plats.map(badge).join(" ") || `<span class="muted" style="font-size:12.5px">未下发到任何平台</span>`}</td>
      <td><div class="row-actions"><button onclick="viewSkill(${jstr(r.slug)})">查看</button>${r.registered
        ? (r.archived
          ? `<button onclick="archiveOne(${jstr(r.slug)}, false)">取消归档</button>`
          : `<button onclick="archiveOne(${jstr(r.slug)}, true)">归档</button>`)
        : ""}</div></td></tr>`).join("")}</tbody></table></div></div>${pagerBar("library", pg)}`;
}

// ---- 操作历史（registry/audit.logl 的结构化留痕，最新在前） ----
let HISTORY = null;
const ACTION_TEXT = { adopt: "采纳", resolve: "裁决", apply: "下发", ignore: "忽略", archive: "归档" };
const ACTION_CLS = { adopt: "st-unregistered", resolve: "st-synced-copy",
                     apply: "st-managed-ok", ignore: "st-ignored", archive: "st-archived" };

async function ensureHistory() {
  if (HISTORY) return HISTORY;
  const d = await api("/api/history?limit=500");
  HISTORY = d.entries || [];
  return HISTORY;
}

// ---- 撤销：/api/undo 状态表 + 行内撤销 ----
const UNDO_MAP = {}; // id -> executed(bool)
async function ensureUndoMap() {
  const d = await api("/api/undo");
  (d.entries || []).forEach(u => { UNDO_MAP[u.id] = !!u.executed; });
}
window.undoOne = async function (id) {
  if (!confirm("确认撤销该操作？将按记录逆序回放到操作前状态。")) return;
  try {
    const r = await api("/api/undo", { method: "POST", body: { id } });
    UNDO_MAP[id] = true;
    toast(`已撤销：${(r.results || []).length} 步恢复完成`, "ok");
    HISTORY = null;
    await render();
  } catch (e) { toast(e.message, "err"); }
};

// 历史行匹配：平台筛选按记录平台；搜索覆盖整条记录的全部字段
function matchHistoryRow(rec) {
  if (platformFilter !== "all" && rec.platform && rec.platform !== "*"
      && rec.platform !== platformFilter) return false;
  if (!query) return true;
  const hay = JSON.stringify(rec).toLowerCase();
  return query.split(/\s+/).every(t => hay.includes(t));
}

function historyDetail(rec) {
  const skip = new Set(["time", "action", "slug", "platform"]);
  return Object.entries(rec)
    .filter(([k]) => !skip.has(k))
    .map(([k, v]) => `${k}=${typeof v === "string" ? v : JSON.stringify(v)}`)
    .join(" · ");
}

function renderHistoryTab() {
  if (HISTORY) { paintHistory(HISTORY); return; }
  $("#panel").innerHTML = emptyBlock("···", "加载操作历史…", "READING AUDIT.LOG");
  ensureHistory()
    .then(() => ensureUndoMap())
    .then(() => { if (curTab() === "history") render(); })
    .catch(e => { $("#panel").innerHTML = `<div class="warn">${esc(e.message)}</div>`; });
}

function paintHistory(all) {
  const rows = all.filter(matchHistoryRow);
  $("#cnt-history").textContent = String(all.length);
  updatePageSummary("history", { history: all.length });
  $("#filterInfo").textContent =
    filtersActive() ? `FILTER ${rows.length} / ${all.length}` : "";
  $("#clearFilter").style.display = filtersActive() ? "" : "none";
  if (filtersActive() && !rows.length && all.length) {
    $("#panel").innerHTML = `<div class="empty"><div class="glyph">⌕</div>
      <div class="et">没有匹配的操作记录</div>
      <div class="es">调整关键词或平台筛选，或 <button onclick="clearFilters()">清除筛选</button></div></div>`;
    return;
  }
  renderHistory(rows);
}

function renderHistory(rows) {
  if (!rows.length) { $("#panel").innerHTML = emptyBlock("———", "暂无操作记录", "AUDIT LOG EMPTY"); return; }
  const pg = pageSlice(rows, "history");
  $("#panel").innerHTML = `<div class="tbl-wrap"><table class="history-table"><thead><tr>
    <th style="width:175px">时间 / TIME</th><th style="width:90px">动作 / ACTION</th><th>对象与详情 / TARGET & DETAIL</th>
    </tr></thead><tbody>${pg.items.map(rec => {
      const when = (rec.time || "").replace("T", " ");
      const act = rec.action || "?";
      const plat = rec.platform === "*" ? "全部平台"
        : rec.platform && rec.platform !== "-" ? badge(rec.platform) : "";
      let undoCtl = "";
      if (rec.undo && act !== "undo") {
        const done = UNDO_MAP[rec.undo];
        undoCtl = done === undefined ? "" : done
          ? ` <span class="muted" style="font-size:12.5px">已撤销</span>`
          : ` <button style="padding:2px 10px;font-size:12.5px" onclick="undoOne('${esc(rec.undo)}')">撤销</button>`;
      }
      return `<tr>
        <td><span class="hist-time">${esc(when)}</span></td>
        <td><span class="st ${ACTION_CLS[act] || ""}">${esc(ACTION_TEXT[act] || act)}</span></td>
        <td><strong>${esc(rec.slug || "—")}</strong> ${plat}${undoCtl}
          <div class="detail">${esc(historyDetail(rec)) || "—"}</div></td></tr>`;

// ---- 零依赖 Markdown 渲染（先整体转义再有限解析，无 XSS 注入面） ----
function mdToHtml(src) {
  const lines = String(src).replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;
  // 行内转换：转义后的文本上做有限替换；链接仅允许 http(s)
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (_m, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // frontmatter 元数据折叠展示，不混入正文
  if (lines[0] && lines[0].trim() === "---") {
    let end = -1;
    for (let k = 1; k < lines.length; k++)
      if (lines[k].trim() === "---") { end = k; break; }
    if (end > 0) {
      out.push(`<details class="md-fm"><summary>FRONTMATTER · 元数据</summary><pre>${esc(lines.slice(1, end).join("\n"))}</pre></details>`);
      i = end + 1;
    }
  }
  const isTableSep = l => /^\s*\|[\s:|-]+\|\s*$/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre class="md-code"><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(line); i += 2;
      const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(cells(lines[i++]));
      out.push(`<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${
        body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${mdToHtml(buf.join("\n"))}</blockquote>`);
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = []; let cur = null;
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        const indent = lines[i].match(/^\s*/)[0].length;
        const text = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, "");
        if (indent >= 2 && cur) cur.sub.push(text);
        else { cur = { text, sub: [] }; items.push(cur); }
        i++;
      }
      const lis = items.map(it => `<li>${inline(it.text)}${
        it.sub.length ? `<${ordered ? "ol" : "ul"}>${it.sub.map(s => `<li>${inline(s)}</li>`).join("")}</${ordered ? "ol" : "ul"}>` : ""}</li>`).join("");
      out.push(`<${ordered ? "ol" : "ul"}>${lis}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [line]; i++;
    while (i < lines.length && lines[i].trim() &&
      !/^\s*(#{1,6}\s|```|>|\|)/.test(lines[i]) &&
      !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) &&
      !/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
  }
  return out.join("\n");
}

// SKILL.md 只读查看器：默认 Markdown 渲染，可切原文；英文内容提供离线英译中（译文仅预览，不落盘）
function isMostlyEnglish(text) {
  const cjk = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  const lat = (text.match(/[A-Za-z]/g) || []).length;
  return lat > 20 && cjk < Math.max(3, lat / 4);
}

function showSkillViewer(title, meta, content) {
  const english = isMostlyEnglish(content);
  let translated = null, showingZh = false, rawMode = false;
  modal(title,
    `<div class="meta-line">${meta}<span class="view-toggle">
       <button id="modeRawBtn" title="查看未经排版的原始文本">原文</button><button id="modeMdBtn" class="active" title="渲染标题/代码块/表格等排版">渲染</button>
     </span></div><div class="md-body" id="mdBody"></div>`,
    `<button onclick="closeModal()">关闭</button>` +
    (english ? `<button class="primary" id="translateBtn">译为中文</button>` : ""));
  const paint = () => {
    const text = showingZh ? translated : content;
    $("#mdBody").innerHTML = rawMode
      ? `<pre class="skill-view">${esc(text)}</pre>`
      : `<div class="md-view">${mdToHtml(text)}</div>`;
    $("#modeRawBtn").classList.toggle("active", rawMode);
    $("#modeMdBtn").classList.toggle("active", !rawMode);
  };
  $("#modeRawBtn").onclick = () => { rawMode = true; paint(); };
  $("#modeMdBtn").onclick = () => { rawMode = false; paint(); };
  paint();
  const btn = $("#translateBtn");
  if (!btn) return;
  PRETRANS.paused = true; paintPretransChip();  // 批处理让路，详情翻译优先
  // 自动预热：弹窗打开即在后台开译，稍后点「译为中文」通常瞬时出结果
  let prewarmed = null;
  if (english) {
    prewarmed = DOC_TR.get(content) || null;
    if (!prewarmed) {
      prewarmed = api("/api/translate", { method: "POST", body: { text: content } })
        .catch(e => { DOC_TR.delete(content); throw e; });
      DOC_TR.set(content, prewarmed);
      if (DOC_TR.size > 24) DOC_TR.delete(DOC_TR.keys().next().value);
    }
    prewarmed.catch(() => {});  // 预热失败静默，点按钮时再报
  }
  btn.onclick = async () => {
    if (translated !== null) {
      showingZh = !showingZh;
      paint();
      btn.textContent = showingZh ? "查看原文" : "译为中文";
      return;
    }
    btn.disabled = true; btn.textContent = "翻译中…（本地离线模型）";
    try {
      const r = await (prewarmed || api("/api/translate", { method: "POST", body: { text: content } }));
      if (r.skipped) { btn.remove(); return; }
      translated = r.translated; showingZh = true;
      paint();
      btn.textContent = "查看原文"; btn.disabled = false;
      toast(`翻译引擎：${r.engine}（仅预览，不写文件）`, "ok");
    } catch (e) {
      prewarmed = null;  // 失败后下次点击重新发起
      btn.disabled = false; btn.textContent = "译为中文";
      toast(e.message, "err");
    }
  };
}

$("#tabs").addEventListener("keydown", e => {

  if (current < 0) return;
  let next = current;
  if (e.key === "ArrowDown" || e.key === "ArrowRight") next = (current + 1) % tabs.length;
  else if (e.key === "ArrowUp" || e.key === "ArrowLeft") next = (current - 1 + tabs.length) % tabs.length;
  else if (e.key === "Home") next = 0;
  else if (e.key === "End") next = tabs.length - 1;
  else return;
  e.preventDefault(); tabs[next].focus(); tabs[next].click();
});
updateTabsHint();
$("#libraryControls").addEventListener("click", e => {
  const filter = e.target.closest("[data-library-filter]");
  if (filter) {
    libraryFilter = filter.dataset.libraryFilter;
    pagePos.library = 1;
    render();
  }
});
$("#libraryCardsBtn").onclick = () => setLibraryView("cards");
$("#libraryListBtn").onclick = () => setLibraryView("list");

refresh().catch(e => toast("初始扫描失败：" + e.message, "err"));
</script>
