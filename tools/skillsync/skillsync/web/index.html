<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skillsync 控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e7ebf1;
    --bg-deep: #dde3ec;
    --panel: #ffffff;
    --panel-2: #f7f9fc;
    --raise: #f1f4f9;
    --ink: #182030;
    --ink-soft: #33404f;
    --muted: #5b6576;
    --faint: #8a93a3;
    --line: #dbe1ea;
    --line-strong: #c2cad8;
    --shadow-card: 0 1px 2px rgba(24,39,60,.05), 0 4px 14px rgba(24,39,60,.06);
    --shadow-pop: 0 18px 50px rgba(24,39,60,.22);

    --amber: #c2700c;
    --amber-fill: #f39a18;
    --amber-deep: #d9820a;
    --amber-soft: #fdf3e2;
    --amber-line: #f0d29a;
    --green: #177a41;
    --green-soft: #e7f6ec;
    --green-line: #b7e0c4;
    --red: #cf2e2e;
    --red-soft: #fdeceb;
    --red-line: #f3c1be;
    --blue: #1d57c4;
    --blue-soft: #e9f0fd;
    --blue-line: #bcd2f6;
    --violet: #7239c9;
    --violet-soft: #f2ebfd;
    --violet-line: #d8c4f4;
    --pink: #c2367c;
    --pink-soft: #fcebf4;
    --pink-line: #f2bfda;

    --term-bg: #10141b;
    --term-ink: #d3dbe8;
    --term-line: rgba(255,255,255,.10);

    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", monospace;
    --disp: "Martian Mono", "IBM Plex Mono", ui-monospace, monospace;
    --sans: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html { height: 100%; scrollbar-color: #c6cedb transparent; }
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    display: flex; flex-direction: column;
    font: 13.5px/1.65 var(--sans);
    background: var(--bg);
    color: var(--ink);
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(1000px 480px at 84% -10%, rgba(243,154,24,.10), transparent 60%),
      radial-gradient(820px 560px at -10% 110%, rgba(29,87,196,.07), transparent 55%),
      linear-gradient(180deg, #eef1f6, var(--bg) 38%, var(--bg-deep));
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(rgba(24,40,66,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(24,40,66,.04) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 8%, transparent 78%);
            mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 8%, transparent 78%);
  }
  ::selection { background: rgba(243,154,24,.28); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #c2cad8; border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #aab5c6; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 顶栏 ---------- */
  header {
    flex: none; z-index: 20;
    background: rgba(255,255,255,.92);
    border-bottom: 1px solid var(--line);
  }
  .header-inner { max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  .mark {
    width: 34px; height: 34px; flex: none; border-radius: 7px;
    border: 1px solid var(--amber-line); background: var(--amber-soft);
    color: var(--amber); display: grid; place-items: center;
    box-shadow: inset 0 0 10px rgba(243,154,24,.14);
  }
  .wm-name { font-family: var(--disp); font-weight: 800; font-size: 15px; letter-spacing: .02em; line-height: 1.15; color: var(--ink); }
  .wm-sub { font-family: var(--mono); font-size: 9.5px; letter-spacing: .22em; color: var(--faint); margin-top: 2px; }
  .spacer { flex: 1; }
  .chip {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); background: var(--panel-2);
    border-radius: 5px; padding: 5px 10px; display: inline-flex; align-items: center; gap: 8px;
    max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: #22a35c; flex: none;
           box-shadow: 0 0 0 0 rgba(34,163,92,.45); animation: pulse 2.2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,163,92,.45); }
    70% { box-shadow: 0 0 0 7px rgba(34,163,92,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,163,92,0); }
  }
  .scan-time { font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: .04em; }

  button {
    font-family: var(--sans); font-size: 12.5px; font-weight: 600;
    color: var(--ink-soft); background: var(--panel);
    border: 1px solid var(--line-strong); border-radius: 5px;
    padding: 6px 13px; cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s, transform .08s;
  }
  button:hover { border-color: #9fb0c6; background: var(--raise); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--amber-fill); border-color: var(--amber-deep); color: #241402; font-weight: 700; }
  button.primary:hover { background: var(--amber-deep); border-color: #b06a08; }
  button.danger { color: var(--red); border-color: var(--red-line); background: var(--red-soft); }
  button.danger:hover { border-color: #e28985; background: #f9dedd; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #refreshBtn { background: transparent; color: var(--amber); border-color: var(--amber-line); font-family: var(--mono);
                font-size: 11.5px; letter-spacing: .06em; }
  #refreshBtn:hover { background: var(--amber-soft); }

  main {
    flex: 1 1 auto; min-height: 0; width: 100%; max-width: 1240px;
    margin: 0 auto; padding: 16px 24px 10px;
    display: flex; flex-direction: column;
  }

  /* ---------- 仪表卡片 ---------- */
  .cards { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 14px; }
  .card {
    position: relative; overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    box-shadow: var(--shadow-card);
    padding: 15px 16px 13px 18px;
    animation: rise .45s cubic-bezier(.2,.7,.2,1) both;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--line-strong);
  }
  .card.green::before { background: #22a35c; }
  .card.red::before { background: var(--red); }
  .card.amber::before { background: var(--amber-fill); }
  .card:nth-child(1) { animation-delay: .04s; }
  .card:nth-child(2) { animation-delay: .10s; }
  .card:nth-child(3) { animation-delay: .16s; }
  .card:nth-child(4) { animation-delay: .22s; }
  .card:nth-child(5) { animation-delay: .28s; }
  .card .idx { font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; color: var(--faint); }
  .card .n {
    font-family: var(--disp); font-weight: 700; font-size: 32px; line-height: 1.1;
    letter-spacing: -.01em; margin: 3px 0 2px; font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .card.green .n { color: var(--green); }
  .card.red .n { color: var(--red); }
  .card.amber .n { color: var(--amber); }
  .card .t { font-size: 12.5px; color: var(--muted); }
  .card .en { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; color: var(--faint); margin-top: 3px; text-transform: uppercase; }

  /* ---------- 同步控制台 ---------- */
  .syncbox {
    background: var(--amber-soft);
    border: 1px solid var(--amber-line); border-radius: 8px;
    box-shadow: var(--shadow-card);
    padding: 12px 16px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    animation: rise .45s .32s cubic-bezier(.2,.7,.2,1) both;
  }
  .sync-label { flex: none; padding-right: 16px; border-right: 1px solid var(--amber-line); }
  .sync-label .lab-en { font-family: var(--mono); font-size: 9px; letter-spacing: .22em; color: var(--amber); }
  .sync-label .lab-cn { font-size: 13px; font-weight: 700; margin-top: 1px; color: #5f3a08; }
  .sync-actions { flex: none; display: flex; gap: 8px; }
  .syncbox .hint { color: #8a6429; font-size: 11.5px; }
  .syncbox .hint code { font-family: var(--mono); color: #6e4c12; background: rgba(194,112,12,.08);
                        padding: 1px 5px; border-radius: 3px; font-size: 10.5px; }
  .syncbox .hint b { color: var(--amber); font-weight: 600; font-family: var(--mono); font-size: 11px; }

  /* ---------- Tabs ---------- */
  .tabs { flex: none; display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 4px; }
  .tabs-hint {
    flex: none; padding: 7px 14px 0;
    font-size: 11.5px; line-height: 1.5; color: var(--muted);
  }
  .tabs-hint::before { content: "ⓘ"; font-family: var(--mono); color: var(--amber);
                       margin-right: 7px; font-weight: 700; }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    border-radius: 0; color: var(--muted); padding: 10px 14px;
    font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
  }
  .tabs button:hover { background: none; border-bottom-color: var(--line-strong); color: var(--ink); }
  .tabs button.active { color: var(--amber); border-bottom-color: var(--amber-fill); font-weight: 600; }
  .tab-n {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    min-width: 22px; text-align: center; padding: 1px 6px;
    background: var(--raise); border: 1px solid var(--line); border-radius: 3px;
    font-variant-numeric: tabular-nums;
  }
  .tabs button.active .tab-n { color: var(--amber); background: var(--amber-soft); border-color: var(--amber-line); }

  /* ---------- 搜索筛选工具栏 ---------- */
  .toolbar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .toolbar input[type=search] {
    width: 300px; padding: 7px 12px; font: inherit; font-size: 12.5px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel-2); color: var(--ink); outline: none;
  }
  .toolbar input[type=search]:focus { border-color: var(--amber-fill); background: #fff; }
  .toolbar input[type=search]::placeholder { color: var(--faint); }
  .toolbar select {
    padding: 7px 9px; font: inherit; font-size: 12.5px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel-2); color: var(--ink);
  }
  #clearFilter { padding: 6px 12px; font-size: 12px; }
  #importBtn { padding: 6px 14px; font-size: 12px; }
  .filter-info { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .hist-time { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* ---------- Markdown 查看器 ---------- */
  .md-body { margin-top: 10px; }
  .view-toggle { margin-left: auto; display: inline-flex; gap: 4px; }
  .view-toggle button { padding: 3px 11px; font-size: 11px; border-radius: 6px; }
  .view-toggle button.active { background: var(--amber-soft); border-color: var(--amber-line); color: var(--amber-deep); }
  .md-view { color: var(--ink); font-size: 13px; line-height: 1.68; overflow-wrap: break-word; }
  .md-view h1, .md-view h2 {
    font-size: 16.5px; font-weight: 700; margin: 20px 0 9px; padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .md-view h1:first-child, .md-view h2:first-child { margin-top: 2px; }
  .md-view h3 { font-size: 14.5px; font-weight: 700; margin: 15px 0 6px; }
  .md-view h4, .md-view h5, .md-view h6 { font-size: 13px; font-weight: 700; margin: 12px 0 5px; color: var(--amber-deep); }
  .md-view p { margin: 7px 0; }
  .md-view a { color: var(--amber-deep); text-decoration: underline; text-underline-offset: 2px; }
  .md-view ul, .md-view ol { margin: 7px 0; padding-left: 22px; }
  .md-view li { margin: 3px 0; }
  .md-view li > ul, .md-view li > ol { margin: 2px 0; }
  .md-view code {
    font-family: var(--mono); font-size: 11.5px; color: var(--amber-deep);
    background: var(--amber-soft); border: 1px solid var(--amber-line);
    border-radius: 5px; padding: 1px 5px;
  }
  .md-view pre.md-code {
    background: var(--term-bg); color: var(--term-ink);
    border-radius: 8px; padding: 12px 14px; overflow: auto; margin: 10px 0;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
  }
  .md-view pre.md-code code { background: none; border: none; color: inherit; padding: 0; font-size: inherit; }
  .md-view blockquote {
    margin: 9px 0; padding: 5px 13px; color: var(--muted);
    border-left: 3px solid var(--amber-fill); background: var(--amber-soft);
    border-radius: 0 6px 6px 0;
  }
  .md-view table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 10px 0; font-size: 12.5px; }
  .md-view table th, .md-view table td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .md-view table th { background: var(--panel-2); font-weight: 600; color: var(--muted); }
  .md-view hr { border: none; border-top: 1px solid var(--line); margin: 15px 0; }
  .md-fm { margin: 0 0 12px; }
  .md-fm summary { cursor: pointer; font-family: var(--mono); font-size: 10px; letter-spacing: .16em; color: var(--faint); }
  .md-fm pre {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 13px; overflow: auto; color: var(--muted);
    font-family: var(--mono); font-size: 11px; line-height: 1.55;
  }

  .panel {
    flex: 1 1 auto; min-height: 0;
    background: var(--panel);
    border: 1px solid var(--line); border-top: none;
    border-radius: 0 0 8px 8px;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-card);
  }
  .panel > * { animation: fade .24s ease both; }
  /* 唯一滚动区：表格内部滚动，分页条始终钉在底部可见 */
  .tbl-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .panel > .empty { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  table { width: 100%; border-collapse: separate; border-spacing: 0; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
  th {
    font-family: var(--mono); font-weight: 600; font-size: 9.5px; letter-spacing: .18em;
    color: var(--faint); text-transform: uppercase;
    background: var(--panel-2); position: sticky; top: 0; z-index: 2;
    box-shadow: inset 0 -1px 0 var(--line);
  }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: var(--amber-soft); }
  tbody tr:last-child td { border-bottom: none; }
  td strong { font-weight: 600; }
  .detail { color: var(--faint); font-size: 11.5px; margin-top: 2px; line-height: 1.5; }
  .detail.clamp2 {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden; max-width: 640px;
  }

  .badge {
    display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .03em;
    padding: 2px 7px; border-radius: 4px; border: 1px solid; white-space: nowrap;
  }
  .b-codex { color: var(--green); background: var(--green-soft); border-color: var(--green-line); }
  .b-claude { color: var(--violet); background: var(--violet-soft); border-color: var(--violet-line); }
  .b-workbuddy { color: var(--pink); background: var(--pink-soft); border-color: var(--pink-line); }
  .b-trae { color: var(--blue); background: var(--blue-soft); border-color: var(--blue-line); }

  .st { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 4px; white-space: nowrap;
        border: 1px solid var(--line); color: var(--muted); background: var(--raise); }
  .st-fork, .st-broken-link, .st-missing-target, .st-managed-foreign, .st-missing-canonical
    { color: var(--red); background: var(--red-soft); border-color: var(--red-line); }
  .st-unregistered, .st-duplicate
    { color: var(--amber); background: var(--amber-soft); border-color: var(--amber-line); }
  .st-synced-copy { color: var(--blue); background: var(--blue-soft); border-color: var(--blue-line); }
  .st-managed-ok { color: var(--green); background: var(--green-soft); border-color: var(--green-line); }
  .st-ignored { color: var(--faint); }

  .row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .row-actions button { padding: 4px 11px; font-size: 11.5px; }
  td:has(> .row-actions) { vertical-align: middle; }
  td.cell-badges { vertical-align: middle; }

  .empty { padding: 70px 20px; text-align: center; color: var(--faint); }
  .empty .glyph { font-family: var(--disp); font-size: 26px; color: var(--line-strong); letter-spacing: .2em; margin-bottom: 12px; }
  .empty .et { font-size: 13px; color: var(--muted); }
  .empty .es { font-family: var(--mono); font-size: 9.5px; letter-spacing: .24em; color: var(--faint); margin-top: 4px; }

  /* ---------- 分页条 ---------- */
  .pager-bar {
    flex: none;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 9px 16px; background: var(--panel-2); border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .pager-info { margin-right: auto; }
  .pager-info b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pager-pages { display: flex; gap: 4px; align-items: center; }
  .pg {
    min-width: 28px; padding: 3px 8px; font-size: 11.5px; font-family: var(--mono);
    border-radius: 4px; border: 1px solid var(--line-strong); background: var(--panel);
    color: var(--ink-soft); cursor: pointer;
  }
  .pg:hover:not(:disabled):not(.cur) { border-color: var(--amber-line); background: var(--amber-soft); color: var(--amber); }
  .pg.cur { background: var(--amber-fill); border-color: var(--amber-deep); color: #241402; font-weight: 700; }
  .pg:disabled { opacity: .35; cursor: default; }
  .pg.ellipsis { border: 0; background: none; pointer-events: none; color: var(--faint); padding: 3px 4px; }
  .pager-size {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--line-strong); border-radius: 4px; background: var(--panel);
    padding: 3px 6px; cursor: pointer;
  }

  /* 终端块：刻意保留深色材质（输出/diff） */
  pre.out {
    background: var(--term-bg); color: var(--term-ink); border: 1px solid var(--term-line); border-radius: 6px;
    padding: 13px 14px; font-family: var(--mono); font-size: 11.5px; line-height: 1.7;
    max-height: 340px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 10px 0 0;
  }
  .diff-add { background: rgba(85,224,143,.13); color: #8cebb3; display: block; margin: 0 -14px; padding: 0 14px; }
  .diff-del { background: rgba(255,95,86,.13); color: #ffa39d; display: block; margin: 0 -14px; padding: 0 14px; }
  .diff-hunk { color: #7db4ff; display: block; }

  /* ---------- 模态框 ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(24,32,48,.34); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px;
  }
  .modal-mask.show { display: flex; animation: fade .18s ease both; }
  .modal {
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px;
    width: min(820px, 94vw); max-height: 86vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: var(--shadow-pop);
  }
  .modal-mask.show .modal { animation: pop .22s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
  .modal h3 {
    margin: 0; padding: 15px 20px; border-bottom: 1px solid var(--line);
    font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--ink);
    display: flex; align-items: center; gap: 10px; background: var(--panel-2);
  }
  .modal h3::before { content: ""; width: 7px; height: 7px; background: var(--amber-fill); border-radius: 1px; flex: none; }
  .modal .body { padding: 18px 20px; overflow: auto; }
  .modal .foot {
    padding: 12px 20px; border-top: 1px solid var(--line);
    display: flex; justify-content: flex-end; gap: 8px; background: var(--panel-2);
  }
  .modal label.ck { display: inline-flex; gap: 7px; align-items: center; margin-right: 16px;
                    font-size: 13px; color: var(--ink); cursor: pointer; }
  .modal label.ck input { accent-color: var(--amber-deep); }
  .modal .warn {
    background: var(--amber-soft); border: 1px solid var(--amber-line); color: #7d5210;
    border-radius: 6px; padding: 9px 12px; font-size: 12px; margin: 12px 0 0;
  }
  .meta-line { color: var(--muted); font-size: 11.5px; margin-bottom: 10px; font-family: var(--mono); }
  .skill-view {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.7; white-space: pre-wrap;
    background: var(--term-bg); color: var(--term-ink); border: 1px solid var(--term-line); border-radius: 6px;
    padding: 14px; max-height: 60vh; overflow: auto;
  }

  /* ---------- Toast ---------- */
  #toasts { position: fixed; right: 18px; bottom: 18px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    position: relative; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 7px;
    padding: 10px 16px 10px 18px; font-size: 12.5px; max-width: 440px;
    box-shadow: 0 12px 30px rgba(24,39,60,.20);
    animation: toast-in .25s cubic-bezier(.2,.8,.2,1) both;
  }
  .toast::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
                   border-radius: 2px; background: var(--blue); }
  .toast.err { border-color: var(--red-line); } .toast.err::before { background: var(--red); }
  .toast.ok { border-color: var(--green-line); } .toast.ok::before { background: #22a35c; }
  @keyframes toast-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

  .foot-note {
    flex: none; margin-top: 7px; text-align: center;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; color: var(--faint);
  }

  @media (max-width: 980px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .scan-time, .chip { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="mark" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="8" cy="8" r="4.6"/>
        <path d="M8 .8v3M8 12.2v3M.8 8h3M12.2 8h3"/>
        <circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div>
      <div class="wm-name">SKILLSYNC</div>
      <div class="wm-sub">本机技能分发控制台 · LOCAL CONSOLE</div>
    </div>
    <span class="spacer"></span>
    <span class="chip" id="repo"><span class="pulse"></span>加载中…</span>
    <span class="scan-time" id="lastScan"></span>
    <button id="refreshBtn">↻ 刷新对账</button>
  </div>
</header>

<main>
  <div class="cards" id="cards"></div>

  <div class="syncbox">
    <div class="sync-label">
      <div class="lab-en">DISPATCH</div>
      <div class="lab-cn">同步下发</div>
    </div>
    <div class="sync-actions">
      <button id="applyDry">预演 · dry-run</button>
      <button id="applyWriteLink" class="primary">执行 apply --write --link</button>
    </div>
    <span class="hint">实体副本先改名 <code>.bak-时间戳</code>，分叉内容安全拒绝。最近执行：<b id="lastApply">无</b></span>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="library" class="active" title="共享仓 canonical 的技能本体（唯一事实源），可查看 SKILL.md">技能库<span class="tab-n" id="cnt-library">0</span></button>
    <button data-tab="pending" title="平台目录里的新技能或重复副本，尚未纳入共享仓；可查看详情、采纳进 canonical 或忽略">待采纳<span class="tab-n" id="cnt-pending">0</span></button>
    <button data-tab="managed" title="已通过软链下发到各平台的技能，以及被忽略、不再参与同步的技能">已纳管 / 忽略<span class="tab-n" id="cnt-managed">0</span></button>
    <button data-tab="problems" title="需要处理的异常：内容分叉、软链损坏、平台缺目标、外来软链等，可查看差异或一键修复">问题与分叉<span class="tab-n" id="cnt-problems">0</span></button>
    <button data-tab="history" title="adopt / resolve / apply / ignore 全部操作的结构化留痕（registry/audit.logl），最新在前">操作历史<span class="tab-n" id="cnt-history">0</span></button>
  </div>
  <div class="tabs-hint" id="tabsHint"></div>
  <div class="toolbar" id="toolbar">
    <input type="search" id="searchBox" placeholder="搜索名称 / 简介 / 关键词（空格分隔多词）…"
           oninput="onSearch(this.value)" autocomplete="off">
    <select id="platformSel" onchange="onPlatform(this.value)" aria-label="平台筛选">
      <option value="all">全部平台</option>
      <option value="codex">codex</option>
      <option value="claude">claude</option>
      <option value="workbuddy">workbuddy</option>
      <option value="trae">trae</option>
    </select>
    <button id="clearFilter" onclick="clearFilters()" style="display:none">清除筛选</button>
    <button id="importBtn" onclick="openImport()" title="从 github.com / skills.sh 导入技能到 canonical（先预览后落盘）">导入</button>
    <span class="filter-info" id="filterInfo"></span>
  </div>
  <div class="panel" id="panel"></div>

  <div class="foot-note">127.0.0.1 ONLY · 唯一事实源 CANONICAL · 写操作经 AUDIT.LOGL 留痕 · 网页只读不编辑</div>
</main>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="body" id="modalBody"></div>
    <div class="foot" id="modalFoot"></div>
  </div>
</div>
<div id="toasts"></div>

<script>
"use strict";
const PLATFORMS = ["codex", "claude", "workbuddy", "trae"];
const PROBLEM_STATUSES = ["fork", "broken-link", "missing-target", "managed-foreign", "missing-canonical", "bad-frontmatter"];
const PAGE_SIZES = [15, 30, 50];
const STATUS_TEXT = {
  "managed-ok": "已纳管（软链）", "synced-copy": "内容一致副本", "fork": "已分叉",
  "unregistered": "未登记", "duplicate": "内容重复", "missing-target": "平台缺失",
  "managed-foreign": "仓外软链", "broken-link": "软链失效",
  "missing-canonical": "缺 canonical", "bad-frontmatter": "元数据异常", "ignored": "已忽略"
};
let DATA = null;
let pageSize = 15;
const pagePos = { pending: 1, problems: 1, managed: 1, library: 1, history: 1 };

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jstr = v => JSON.stringify(v).replace(/"/g, "&quot;");

function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json();
  if (!data.ok && res.status >= 400 && path.startsWith("/api/") && !path.includes("/scan"))
    throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

async function refresh() {
  const d = await api("/api/scan");
  DATA = d;
  HISTORY = null; // 操作可能已写入新审计记录，缓存失效
  render();
  $("#lastScan").textContent = "SCAN " + new Date().toLocaleTimeString();
  try { watchSig = (await api("/api/poll")).sig; } catch (_) {}
}

// ---- watch 自动扫描：轮询目录签名，变化即重扫（只读，不自动改任何东西） ----
let watchSig = null;
async function watchTick() {
  try {
    const d = await api("/api/poll");
    if (watchSig !== null && d.sig !== watchSig) {
      await refresh(); // refresh() 末尾会更新 watchSig 基线
      toast("检测到技能目录变化，已自动重新扫描", "ok");
      return;
    }
    watchSig = d.sig;
  } catch (_) { /* 服务短暂不可用，下轮再试 */ }
}
setInterval(watchTick, 5000);

function groupByStatus() {
  const g = {};
  for (const f of DATA.findings) (g[f.status] ||= []).push(f);
  return g;
}

function renderCards() {
  const s = DATA.summary;
  const cards = [
    ["canonical 技能", DATA.canonical_count, "", "CANONICAL"],
    ["已纳管软链", s["managed-ok"] || 0, "green", "LINKED"],
    ["需处理问题", DATA.problem_total, DATA.problem_total ? "red" : "", "SIGNALS"],
    ["可采纳 / 转链", (s["unregistered"] || 0) + (s["duplicate"] || 0) + (s["synced-copy"] || 0), "amber", "PENDING"],
    ["平台内置（跳过）", DATA.builtin_counts ? Object.values(DATA.builtin_counts).reduce((a, b) => a + b, 0) : 0, "", "BUILT-IN"]
  ];
  $("#cards").innerHTML = cards.map((c, i) =>
    `<div class="card ${c[2]}"><div class="idx">0${i + 1}/05</div><div class="n">${c[1]}</div><div class="t">${c[0]}</div><div class="en">${c[3]}</div></div>`
  ).join("");
  $("#repo").innerHTML = `<span class="pulse"></span>${esc(DATA.repo_root)}`;
  const la = DATA.state?.last_apply;
  $("#lastApply").textContent = la?.time ? `${la.time}（变更 ${la.changed ?? "?"}）` : "无";
}

function renderTabCounts(g, counts) {
  $("#cnt-pending").textContent = counts.pending;
  $("#cnt-problems").textContent = counts.problems;
  $("#cnt-managed").textContent = counts.managed;
  $("#cnt-library").textContent = counts.library;
}

function badge(p) { return `<span class="badge b-${p}">${p}</span>`; }
function stCell(f) { return `<span class="st st-${f.status}">${STATUS_TEXT[f.status] || f.status}</span>`; }
function emptyBlock(glyph, text, sub) {
  return `<div class="empty"><div class="glyph">${glyph}</div><div class="et">${text}</div><div class="es">${sub}</div></div>`;
}

// ---- 分页：唯一一套切片逻辑 ----
function pageSlice(rows, tab) {
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (pagePos[tab] > pages) pagePos[tab] = pages;
  if (pagePos[tab] < 1) pagePos[tab] = 1;
  const page = pagePos[tab];
  const start = (page - 1) * pageSize;
  return { items: rows.slice(start, start + pageSize), total, pages, page };
}

function pageNumbers(page, pages) {
  const out = [];
  const push = n => out.push(n);
  if (pages <= 7) { for (let i = 1; i <= pages; i++) push(i); return out; }
  push(1);
  if (page > 3) out.push("…");
  for (let i = Math.max(2, page - 1); i <= Math.min(pages - 1, page + 1); i++) push(i);
  if (page < pages - 2) out.push("…");
  push(pages);
  return out;
}

function pagerBar(tab, info) {
  const { total, pages, page } = info;
  if (!total) return "";
  const sizeSel = PAGE_SIZES.map(n =>
    `<option value="${n}" ${n === pageSize ? "selected" : ""}>${n} 条/页</option>`).join("");
  let pagesHtml = "";
  if (pages > 1) {
    pagesHtml = `<div class="pager-pages">
      <button class="pg" ${page === 1 ? "disabled" : ""} onclick="goPage('${tab}', ${page - 1})">‹</button>
      ${pageNumbers(page, pages).map(n => n === "…"
        ? `<span class="pg ellipsis">…</span>`
        : `<button class="pg ${n === page ? "cur" : ""}" onclick="goPage('${tab}', ${n})">${n}</button>`).join("")}
      <button class="pg" ${page === pages ? "disabled" : ""} onclick="goPage('${tab}', ${page + 1})">›</button>
    </div>`;
  }
  return `<div class="pager-bar">
    <span class="pager-info">共 <b>${total}</b> 条 · 第 <b>${page}</b> / ${pages} 页</span>
    <select class="pager-size" onchange="setPageSize(this.value)" aria-label="每页条数">${sizeSel}</select>
    ${pagesHtml}
  </div>`;
}

window.goPage = function (tab, n) {
  pagePos[tab] = n;
  render();
};
window.setPageSize = function (v) {
  pageSize = Number(v);
  for (const k of Object.keys(pagePos)) pagePos[k] = 1;
  render();
};

// ---- 搜索筛选 ----
let query = "";
let platformFilter = "all";

const curTab = () => $("#tabs button.active").dataset.tab;
const filtersActive = () => !!(query || platformFilter !== "all");

window.onSearch = function (v) {
  query = v.trim().toLowerCase();
  pagePos[curTab()] = 1;
  render();
};
window.onPlatform = function (v) {
  platformFilter = v;
  pagePos[curTab()] = 1;
  render();
};
window.clearFilters = function () {
  query = ""; platformFilter = "all";
  $("#searchBox").value = ""; $("#platformSel").value = "all";
  render();
};

// 平台行匹配：missing-canonical 等无平台行的 platform 为 "-"，不受平台筛选限制
function matchRow(f) {
  if (platformFilter !== "all" && f.platform !== "-" && f.platform !== platformFilter) return false;
  if (!query) return true;
  const hay = [f.name, f.detail || "", rowDesc(f), f.platform || ""].join(" ").toLowerCase();
  return query.split(/\s+/).every(t => hay.includes(t));
}

function render() {
  const tab = curTab();
  if (tab === "history") { renderHistoryTab(); return; }
  const g = groupByStatus();
  renderCards();
  const pendingRows = [
    ...(g["unregistered"] || []), ...(g["duplicate"] || []), ...(g["synced-copy"] || [])
  ];
  const problemRows = [];
  for (const st of PROBLEM_STATUSES) problemRows.push(...(g[st] || []));
  const managedRows = [...(g["managed-ok"] || []), ...(g["ignored"] || [])];
  const allLib = libraryRows();
  const pend = pendingRows.filter(matchRow);
  const prob = problemRows.filter(matchRow);
  const man = managedRows.filter(matchRow);
  const lib = allLib.filter(matchLibraryRow);
  renderTabCounts(g, {
    pending: pendingRows.length, problems: problemRows.length,
    managed: managedRows.length, library: allLib.length
  });
  // 筛选提示：页签计数保持全量，这里显示当前页签的匹配数
  const totals = { pending: pendingRows.length, problems: problemRows.length,
                   managed: managedRows.length, library: allLib.length };
  const shown = { pending: pend, problems: prob, managed: man, library: lib }[tab];
  $("#filterInfo").textContent =
    filtersActive() ? `FILTER ${shown.length} / ${totals[tab]}` : "";
  $("#clearFilter").style.display = filtersActive() ? "" : "none";
  // 有数据但被筛没：显示筛选空态（与真正无数据的空态区分）
  if (filtersActive() && !shown.length && totals[tab]) {
    $("#panel").innerHTML = `<div class="empty"><div class="glyph">⌕</div>
      <div class="et">没有匹配的技能</div>
      <div class="es">调整关键词或平台筛选，或 <button onclick="clearFilters()">清除筛选</button></div></div>`;
    return;
  }
  if (tab === "pending") renderPending(pend);
  else if (tab === "problems") renderProblems(prob);
  else if (tab === "managed") renderManaged(man);
  else renderLibrary(lib);
}

// 行简介：优先平台侧 description（未采纳技能），其次 canonical 的
function rowDesc(f) {
  return (DATA.platform_descriptions || {})[f.platform + "/" + f.name]
      || (DATA.descriptions || {})[f.name] || "";
}
const GENERIC_PENDING_DETAIL = "平台目录中的新技能，尚未纳入共享仓";

function renderPending(rows) {
  if (!rows.length) { $("#panel").innerHTML = emptyBlock("———", "没有待采纳的技能", "NO PENDING SIGNALS"); return; }
  const pg = pageSlice(rows, "pending");
  $("#panel").innerHTML = `<div class="tbl-wrap"><table><thead><tr>
    <th style="width:96px">平台 / PLATFORM</th><th>技能 / SKILL</th><th style="width:230px">操作 / ACTIONS</th>
    </tr></thead><tbody>${pg.items.map(f => {
      const desc = rowDesc(f);
      const statusLine = f.detail === GENERIC_PENDING_DETAIL ? "" :
        `<div class="detail">${esc(f.detail)}</div>`;
      return `<tr>
      <td>${badge(f.platform)}</td>
      <td><strong>${esc(f.name)}</strong>${desc ? `<div class="detail clamp2" title="${esc(desc)}">${esc(desc)}</div>` : ""}${statusLine}</td>
      <td><div class="row-actions">
        <button onclick="viewSource('${f.platform}', ${jstr(f.name)})">查看</button>
        <button class="primary" onclick="openAdopt('${f.platform}', ${jstr(f.name)})">采纳…</button>
        <button onclick="ignoreOne('${f.platform}', ${jstr(f.name)})">忽略</button>
      </div></td></tr>`;}).join("")}</tbody></table></div>${pagerBar("pending", pg)}`;
}

function renderProblems(rows) {
  if (!rows.length) { $("#panel").innerHTML = emptyBlock("✓", "没有需要处理的问题", "ALL SYSTEMS NOMINAL"); return; }
  const pg = pageSlice(rows, "problems");
  $("#panel").innerHTML = `<div class="tbl-wrap"><table><thead><tr>
    <th style="width:96px">平台 / PLATFORM</th><th>技能 / SKILL</th><th style="width:120px">状态 / STATUS</th><th style="width:260px">操作 / ACTIONS</th>
    </tr></thead><tbody>${pg.items.map(f => `<tr>
      <td>${f.platform === "-" ? "" : badge(f.platform)}</td>
      <td><strong>${esc(f.name)}</strong><div class="detail">${esc(f.detail)}</div></td>
      <td>${stCell(f)}</td>
      <td><div class="row-actions">${problemActions(f)}</div></td></tr>`).join("")}</tbody></table></div>${pagerBar("problems", pg)}`;
}

function problemActions(f) {
  const nm = jstr(f.name);
  if (f.status === "fork")
    return `<button onclick="openDiff('${f.platform}', ${nm})">查看差异</button>
      <button onclick="resolveOne('${f.platform}', ${nm}, 'canonical')">以仓为准</button>
      <button class="danger" onclick="resolveOne('${f.platform}', ${nm}, 'platform')">以平台为准</button>`;
  if (f.status === "broken-link" || f.status === "missing-target")
    return `<button class="primary" onclick="applyOnly('${f.platform}', ${nm})">apply 修复</button>`;
  if (f.status === "managed-foreign")
    return `<button class="danger" onclick="applyForce('${f.platform}', ${nm})">强制换链</button>`;
  if (f.status === "bad-frontmatter")
    return f.platform === "-"
      ? `<button onclick="viewSkill(${nm})">查看</button>`
      : `<button onclick="viewSource('${f.platform}', ${nm})">查看</button>`;
  return "";
}

function renderManaged(rows) {
  if (!rows.length) { $("#panel").innerHTML = emptyBlock("———", "暂无已纳管技能", "NOTHING LINKED"); return; }
  const pg = pageSlice(rows, "managed");
  $("#panel").innerHTML = `<div class="tbl-wrap"><table><thead><tr>
    <th style="width:96px">平台 / PLATFORM</th><th>技能 / SKILL</th><th style="width:170px">状态 / STATUS</th>
    </tr></thead><tbody>${pg.items.map(f => f.status === "ignored" ? `<tr>
      <td>${badge(f.platform)}</td>
      <td><strong>${esc(f.name)}</strong> <span class="st st-ignored">已忽略</span>
      <div class="row-actions" style="margin-top:5px"><button onclick="unignoreOne('${f.platform}', ${jstr(f.name)})">取消忽略</button></div></td>
      <td></td></tr>` : `<tr>
      <td>${badge(f.platform)}</td><td><strong>${esc(f.name)}</strong>
      ${(() => { const d = rowDesc(f); return d ? `<div class="detail clamp2" title="${esc(d)}">${esc(d)}</div>` : ""; })()}
      <div class="detail">${esc(f.detail)}</div></td><td>${stCell(f)}</td></tr>`).join("")}</tbody></table></div>${pagerBar("managed", pg)}`;
}

// 技能库行构建（render 与 renderLibrary 共用）
function libraryRows() {
  const okFinds = DATA.findings.filter(f => f.status === "managed-ok");
  const platsOf = slug => [...new Set(okFinds.filter(f => f.name === slug).map(f => f.platform))];
  return [...new Set(okFinds.map(f => f.name))].sort().map(slug =>
    ({ slug, plats: platsOf(slug), desc: (DATA.descriptions || {})[slug] || "" }));
}

// 技能库行匹配：平台筛选按"已下发平台"判断
function matchLibraryRow(r) {
  if (platformFilter !== "all" && !r.plats.includes(platformFilter)) return false;
  if (!query) return true;
  const hay = [r.slug, r.desc, r.plats.join(" ")].join(" ").toLowerCase();
  return query.split(/\s+/).every(t => hay.includes(t));
}

function renderLibrary(rows) {
  if (!rows.length) { $("#panel").innerHTML = emptyBlock("———", "技能库为空", "CANONICAL EMPTY"); return; }
  const pg = pageSlice(rows, "library");
  $("#panel").innerHTML = `<div class="tbl-wrap"><table><thead><tr><th>技能 / SLUG</th><th>已下发平台 / TARGETS</th><th style="width:150px"></th></tr></thead>
    <tbody>${pg.items.map(r => `<tr><td><strong>${esc(r.slug)}</strong>${r.desc ? `<div class="detail clamp2" title="${esc(r.desc)}">${esc(r.desc)}</div>` : ""}</td><td class="cell-badges">${r.plats.map(badge).join(" ")}</td>
      <td><div class="row-actions"><button onclick="viewSkill(${jstr(r.slug)})">查看</button></div></td></tr>`).join("")}</tbody></table></div>${pagerBar("library", pg)}`;
}

// ---- 操作历史（registry/audit.logl 的结构化留痕，最新在前） ----
let HISTORY = null;
const ACTION_TEXT = { adopt: "采纳", resolve: "裁决", apply: "下发", ignore: "忽略" };
const ACTION_CLS = { adopt: "st-unregistered", resolve: "st-synced-copy",
                     apply: "st-managed-ok", ignore: "st-ignored" };

async function ensureHistory() {
  if (HISTORY) return HISTORY;
  const d = await api("/api/history?limit=500");
  HISTORY = d.entries || [];
  return HISTORY;
}

// ---- 撤销：/api/undo 状态表 + 行内撤销 ----
const UNDO_MAP = {}; // id -> executed(bool)
async function ensureUndoMap() {
  const d = await api("/api/undo");
  (d.entries || []).forEach(u => { UNDO_MAP[u.id] = !!u.executed; });
}
window.undoOne = async function (id) {
  if (!confirm("确认撤销该操作？将按记录逆序回放到操作前状态。")) return;
  try {
    const r = await api("/api/undo", { method: "POST", body: { id } });
    UNDO_MAP[id] = true;
    toast(`已撤销：${(r.results || []).length} 步恢复完成`, "ok");
    HISTORY = null;
    await render();
  } catch (e) { toast(e.message, "err"); }
};

// 历史行匹配：平台筛选按记录平台；搜索覆盖整条记录的全部字段
function matchHistoryRow(rec) {
  if (platformFilter !== "all" && rec.platform && rec.platform !== "*"
      && rec.platform !== platformFilter) return false;
  if (!query) return true;
  const hay = JSON.stringify(rec).toLowerCase();
  return query.split(/\s+/).every(t => hay.includes(t));
}

function historyDetail(rec) {
  const skip = new Set(["time", "action", "slug", "platform"]);
  return Object.entries(rec)
    .filter(([k]) => !skip.has(k))
    .map(([k, v]) => `${k}=${typeof v === "string" ? v : JSON.stringify(v)}`)
    .join(" · ");
}

function renderHistoryTab() {
  if (HISTORY) { paintHistory(HISTORY); return; }
  $("#panel").innerHTML = emptyBlock("···", "加载操作历史…", "READING AUDIT.LOGL");
  ensureHistory()
    .then(() => ensureUndoMap())
    .then(() => { if (curTab() === "history") render(); })
    .catch(e => { $("#panel").innerHTML = `<div class="warn">${esc(e.message)}</div>`; });
}

function paintHistory(all) {
  const rows = all.filter(matchHistoryRow);
  $("#cnt-history").textContent = String(all.length);
  $("#filterInfo").textContent =
    filtersActive() ? `FILTER ${rows.length} / ${all.length}` : "";
  $("#clearFilter").style.display = filtersActive() ? "" : "none";
  if (filtersActive() && !rows.length && all.length) {
    $("#panel").innerHTML = `<div class="empty"><div class="glyph">⌕</div>
      <div class="et">没有匹配的操作记录</div>
      <div class="es">调整关键词或平台筛选，或 <button onclick="clearFilters()">清除筛选</button></div></div>`;
    return;
  }
  renderHistory(rows);
}

function renderHistory(rows) {
  if (!rows.length) { $("#panel").innerHTML = emptyBlock("———", "暂无操作记录", "AUDIT LOG EMPTY"); return; }
  const pg = pageSlice(rows, "history");
  $("#panel").innerHTML = `<div class="tbl-wrap"><table><thead><tr>
    <th style="width:175px">时间 / TIME</th><th style="width:90px">动作 / ACTION</th><th>对象与详情 / TARGET & DETAIL</th>
    </tr></thead><tbody>${pg.items.map(rec => {
      const when = (rec.time || "").replace("T", " ");
      const act = rec.action || "?";
      const plat = rec.platform === "*" ? "全部平台"
        : rec.platform && rec.platform !== "-" ? badge(rec.platform) : "";
      let undoCtl = "";
      if (rec.undo && act !== "undo") {
        const done = UNDO_MAP[rec.undo];
        undoCtl = done === undefined ? "" : done
          ? ` <span class="muted" style="font-size:11px">已撤销</span>`
          : ` <button style="padding:2px 10px;font-size:11px" onclick="undoOne('${esc(rec.undo)}')">撤销</button>`;
      }
      return `<tr>
        <td><span class="hist-time">${esc(when)}</span></td>
        <td><span class="st ${ACTION_CLS[act] || ""}">${esc(ACTION_TEXT[act] || act)}</span></td>
        <td><strong>${esc(rec.slug || "—")}</strong> ${plat}${undoCtl}
          <div class="detail">${esc(historyDetail(rec)) || "—"}</div></td></tr>`;
    }).join("")}</tbody></table></div>${pagerBar("history", pg)}`;
}

function modal(title, bodyHtml, footHtml) {
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = bodyHtml;
  $("#modalFoot").innerHTML = footHtml;
  $("#modalMask").classList.add("show");
}
function closeModal() { $("#modalMask").classList.remove("show"); }
$("#modalMask").addEventListener("click", e => { if (e.target.id === "modalMask") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

window.openImport = function () {
  modal("从远程导入技能", `
    <div class="meta-line">支持 github.com 仓库 / tree / blob 链接与 skills.sh 页面；先解析预览，确认后才写入技能库</div>
    <input type="text" id="importUrl" placeholder="https://github.com/owner/repo/tree/main/skills/demo"
           style="width:100%;margin-top:8px" autocomplete="off">
    <div id="importPrev" style="margin-top:10px"></div>`,
    `<button onclick="closeModal()">取消</button>
     <button class="primary" id="importParseBtn">解析预览</button>
     <button class="primary" id="importConfirmBtn" style="display:none" onclick="importConfirmGo()">确认导入</button>`);
  setTimeout(() => $("#importUrl").focus(), 60);
  $("#importParseBtn").onclick = importParse;
};

async function importParse() {
  const url = $("#importUrl").value.trim();
  if (!url) { toast("请先输入 URL", "err"); return; }
  const prev = $("#importPrev");
  prev.innerHTML = '<div class="meta-line">抓取中…（最多 20 秒）</div>';
  $("#importConfirmBtn").style.display = "none";
  try {
    const r = await api("/api/import", { method: "POST", body: { url } });
    const p = r.preview;
    const files = p.files.map(f =>
      `<li>${esc(f.path)} <span class="muted">(${(f.size / 1024).toFixed(1)} KB)</span></li>`).join("");
    prev.innerHTML = `
      <div class="meta-line">SOURCE ${esc(p.source)}</div>
      <div class="detail">${esc(p.description || "（远端未提供简介）")}</div>
      <div style="margin:8px 0 6px">导入名称：
        <input type="text" id="importName" value="${esc(p.name || "")}" style="width:55%" autocomplete="off">
        <span class="muted">${p.files.length} 个文件 · ${(p.total_bytes / 1024).toFixed(1)} KB</span></div>
      <ul style="margin:0 0 0 18px;font-size:12px;line-height:1.7">${files}</ul>`;
    $("#importConfirmBtn").style.display = "";
  } catch (e) {
    prev.innerHTML = `<div class="warn">${esc(e.message)}</div>`;
  }
}

window.openAdopt = function (platform, name) {
  const checks = PLATFORMS.map(p =>
    `<label class="ck"><input type="checkbox" value="${p}" ${p === platform ? "checked" : ""}>${p}</label>`
  ).join("");
  modal(`采纳技能：${name}`, `
    <div class="meta-line">SOURCE ${platform} · 采纳＝复制进 canonical（源目录不动）</div>
    <div>下发到：${checks}</div>
    <div style="margin-top:12px"><label class="ck"><input type="checkbox" id="adoptLink" checked>
      采纳后立即软链下发（源实体目录备份为 .bak-时间戳）</label></div>
    <div class="warn">将产生工作区改动；请在检查 diff 后自行 commit，网页不会替你提交。</div>`,
    `<button onclick="closeModal()">取消</button>
     <button class="primary" id="adoptConfirm">确认采纳</button>`);
  $("#adoptConfirm").onclick = async () => {
    const targets = [...document.querySelectorAll(".modal .body input[type=checkbox][value]")]

};

window.openDiff = async function (platform, name) {
  modal(`${name} · canonical vs ${platform}`, `<div class="meta-line">加载中…</div>`,
    `<button onclick="closeModal()">关闭</button>
     <button onclick="resolveOne('${platform}', ${jstr(name)}, 'canonical')">以仓为准（换软链）</button>
     <button class="danger" onclick="resolveOne('${platform}', ${jstr(name)}, 'platform')">以平台为准</button>`);
  try {
    const d = await api(`/api/diff?platform=${platform}&name=${encodeURIComponent(name)}`);
    const colored = d.diff.split("\n").map(l => {
      let cls = "";
      if (l.startsWith("+") && !l.startsWith("+++")) cls = "diff-add";
      else if (l.startsWith("-") && !l.startsWith("---")) cls = "diff-del";
      else if (l.startsWith("@@")) cls = "diff-hunk";
      return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l);
    }).join("\n");
    $("#modalBody").innerHTML =
      `<div class="meta-line">绿＝canonical 独有 / 红＝${platform} 独有 · 两侧文件均已备份，裁决不会丢内容</div>
       <pre class="out">${colored || "（无文本差异）"}</pre>`;
  } catch (e) { $("#modalBody").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
};

// ---- 零依赖 Markdown 渲染（先整体转义再有限解析，无 XSS 注入面） ----
function mdToHtml(src) {
  const lines = String(src).replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;
  // 行内转换：转义后的文本上做有限替换；链接仅允许 http(s)
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (_m, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // frontmatter 元数据折叠展示，不混入正文
  if (lines[0] && lines[0].trim() === "---") {
    let end = -1;
    for (let k = 1; k < lines.length; k++)
      if (lines[k].trim() === "---") { end = k; break; }
    if (end > 0) {
      out.push(`<details class="md-fm"><summary>FRONTMATTER · 元数据</summary><pre>${esc(lines.slice(1, end).join("\n"))}</pre></details>`);
      i = end + 1;
    }
  }
  const isTableSep = l => /^\s*\|[\s:|-]+\|\s*$/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre class="md-code"><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(line); i += 2;
      const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(cells(lines[i++]));
      out.push(`<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${
        body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${mdToHtml(buf.join("\n"))}</blockquote>`);
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = []; let cur = null;
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        const indent = lines[i].match(/^\s*/)[0].length;
        const text = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, "");
        if (indent >= 2 && cur) cur.sub.push(text);
        else { cur = { text, sub: [] }; items.push(cur); }
        i++;
      }
      const lis = items.map(it => `<li>${inline(it.text)}${
        it.sub.length ? `<${ordered ? "ol" : "ul"}>${it.sub.map(s => `<li>${inline(s)}</li>`).join("")}</${ordered ? "ol" : "ul"}>` : ""}</li>`).join("");
      out.push(`<${ordered ? "ol" : "ul"}>${lis}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [line]; i++;
    while (i < lines.length && lines[i].trim() &&
      !/^\s*(#{1,6}\s|```|>|\|)/.test(lines[i]) &&
      !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) &&
      !/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
  }
  return out.join("\n");
}

// SKILL.md 只读查看器：默认 Markdown 渲染，可切原文；英文内容提供离线英译中（译文仅预览，不落盘）
function isMostlyEnglish(text) {
  const cjk = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  const lat = (text.match(/[A-Za-z]/g) || []).length;
  return lat > 20 && cjk < Math.max(3, lat / 4);
}

function showSkillViewer(title, meta, content) {
  const english = isMostlyEnglish(content);
  let translated = null, showingZh = false, rawMode = false;
  modal(title,
    `<div class="meta-line">${meta}<span class="view-toggle">
       <button id="modeRawBtn" title="查看未经排版的原始文本">原文</button><button id="modeMdBtn" class="active" title="渲染标题/代码块/表格等排版">渲染</button>
     </span></div><div class="md-body" id="mdBody"></div>`,
    `<button onclick="closeModal()">关闭</button>` +
    (english ? `<button class="primary" id="translateBtn">译为中文</button>` : ""));
  const paint = () => {
    const text = showingZh ? translated : content;
    $("#mdBody").innerHTML = rawMode
      ? `<pre class="skill-view">${esc(text)}</pre>`
      : `<div class="md-view">${mdToHtml(text)}</div>`;
    $("#modeRawBtn").classList.toggle("active", rawMode);
    $("#modeMdBtn").classList.toggle("active", !rawMode);
  };
  $("#modeRawBtn").onclick = () => { rawMode = true; paint(); };
  $("#modeMdBtn").onclick = () => { rawMode = false; paint(); };
  paint();
  const btn = $("#translateBtn");
  if (!btn) return;
  btn.onclick = async () => {
    if (translated !== null) {
      showingZh = !showingZh;
      paint();
      btn.textContent = showingZh ? "查看原文" : "译为中文";
      return;
    }
    btn.disabled = true; btn.textContent = "翻译中…（本地离线模型）";
    try {
      const r = await api("/api/translate", { method: "POST", body: { text: content } });
      if (r.skipped) { btn.remove(); return; }
      translated = r.translated; showingZh = true;
      paint();
      btn.textContent = "查看原文"; btn.disabled = false;
      toast(`翻译引擎：${r.engine}（仅预览，不写文件）`, "ok");
    } catch (e) {
      btn.disabled = false; btn.textContent = "译为中文";
      toast(e.message, "err");
    }
  };
}

async function runApply(write, link, force, platform, only) {
  const label = write ? "这会实际改动平台目录（实体目录先备份）。确认执行？" : "预演不会改动任何文件。";
  if (!confirm(label)) return;
  try {
    const r = await api("/api/apply", { method: "POST",
      body: { write, link, force, platform: platform || null, only: only || null } });
    const lines = r.actions.map(a => `[${a.platform}] ${a.slug} ${a.kind} — ${a.detail}`);
    modal(write ? "apply 执行结果" : "apply 预演结果",
      `<div class="meta-line">${r.refused.length ? r.refused.length + " 项被安全拒绝" : "全部可执行 · ALL CLEAR"}</div>
       <pre class="out">${esc(lines.join("\n") || "（无动作）")}</pre>`,
      `<button onclick="closeModal()">关闭</button>`);
    if (write) await refresh();
  } catch (e) { toast(e.message, "err"); }
}
window.applyOnly = (p, n) => runApply(true, true, false, p, n);
window.applyForce = (p, n) => runApply(true, true, true, p, n);

};

  const active = document.querySelector("#tabs button.active");
  $("#tabsHint").textContent = TAB_HINTS[active?.dataset.tab] || "";
}
$("#tabs").addEventListener("click", e => {

    document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    updateTabsHint();
    render();
  }
});
updateTabsHint();

refresh().catch(e => toast("初始扫描失败：" + e.message, "err"));
