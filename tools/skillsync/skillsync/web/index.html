<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skillsync 控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d10;
    --bg2: #0f1115;
    --panel: #13161c;
    --raise: #1c2029;
    --raise2: #232733;
    --ink: #ece8df;
    --muted: #8f95a3;
    --faint: #5f6572;
    --line: rgba(255,255,255,.09);
    --line-strong: rgba(255,255,255,.18);
    --amber: #ffb020;
    --amber-deep: #e69400;
    --amber-soft: rgba(255,176,32,.12);
    --amber-line: rgba(255,176,32,.32);
    --green: #55e08f;
    --green-soft: rgba(85,224,143,.10);
    --red: #ff5f56;
    --red-soft: rgba(255,95,86,.10);
    --blue: #6aa6ff;
    --blue-soft: rgba(106,166,255,.10);
    --violet: #c08cff;
    --violet-soft: rgba(192,140,255,.10);
    --pink: #f478b8;
    --pink-soft: rgba(244,120,184,.10);
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", monospace;
    --disp: "Martian Mono", "IBM Plex Mono", ui-monospace, monospace;
    --sans: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: #2a2f3a transparent; }
  body {
    margin: 0;
    font: 13.5px/1.65 var(--sans);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(1100px 520px at 82% -12%, rgba(255,176,32,.075), transparent 60%),
      radial-gradient(900px 620px at -12% 112%, rgba(106,166,255,.05), transparent 55%),
      linear-gradient(180deg, var(--bg), var(--bg2));
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.032) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.032) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 10%, transparent 78%);
            mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 10%, transparent 78%);
  }
  ::selection { background: rgba(255,176,32,.28); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #2a2f3a; border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #38404e; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 顶栏 ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(12,13,16,.86);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .header-inner { max-width: 1240px; margin: 0 auto; padding: 13px 24px; display: flex; align-items: center; gap: 16px; }
  .mark {
    width: 34px; height: 34px; flex: none; border-radius: 7px;
    border: 1px solid var(--amber-line); background: var(--amber-soft);
    color: var(--amber); display: grid; place-items: center;
    box-shadow: inset 0 0 12px rgba(255,176,32,.12);
  }
  .wm-name { font-family: var(--disp); font-weight: 800; font-size: 15px; letter-spacing: .02em; line-height: 1.15; }
  .wm-sub { font-family: var(--mono); font-size: 9.5px; letter-spacing: .22em; color: var(--faint); margin-top: 2px; }
  .spacer { flex: 1; }
  .chip {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); background: rgba(255,255,255,.03);
    border-radius: 5px; padding: 5px 10px; display: inline-flex; align-items: center; gap: 8px;
    max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none;
           box-shadow: 0 0 0 0 rgba(85,224,143,.6); animation: pulse 2.2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(85,224,143,.5); }
    70% { box-shadow: 0 0 0 7px rgba(85,224,143,0); }
    100% { box-shadow: 0 0 0 0 rgba(85,224,143,0); }
  }
  .scan-time { font-family: var(--mono); font-size: 10.5px; color: var(--faint); letter-spacing: .04em; }

  button {
    font-family: var(--sans); font-size: 12.5px; font-weight: 600;
    color: var(--ink); background: var(--raise);
    border: 1px solid var(--line-strong); border-radius: 5px;
    padding: 6px 13px; cursor: pointer; transition: border-color .15s, background .15s, transform .08s;
  }
  button:hover { border-color: var(--amber-line); background: #22262f; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--amber); border-color: var(--amber); color: #171206; font-weight: 700; }
  button.primary:hover { background: var(--amber-deep); border-color: var(--amber-deep); }
  button.danger { color: var(--red); border-color: rgba(255,95,86,.4); background: var(--red-soft); }
  button.danger:hover { border-color: var(--red); background: rgba(255,95,86,.18); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #refreshBtn { background: transparent; color: var(--amber); border-color: var(--amber-line); font-family: var(--mono);
                font-size: 11.5px; letter-spacing: .06em; }
  #refreshBtn:hover { background: var(--amber-soft); }

  main { max-width: 1240px; margin: 26px auto 40px; padding: 0 24px; }

  /* ---------- 仪表卡片 ---------- */
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 18px; }
  .card {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--panel), #101319);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 15px 16px 13px 18px;
    animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 2px; background: var(--line-strong);
  }
  .card.green::before { background: var(--green); box-shadow: 0 0 12px rgba(85,224,143,.5); }
  .card.red::before { background: var(--red); box-shadow: 0 0 12px rgba(255,95,86,.5); }
  .card.amber::before { background: var(--amber); box-shadow: 0 0 12px rgba(255,176,32,.5); }
  .card:nth-child(1) { animation-delay: .04s; }
  .card:nth-child(2) { animation-delay: .10s; }
  .card:nth-child(3) { animation-delay: .16s; }
  .card:nth-child(4) { animation-delay: .22s; }
  .card:nth-child(5) { animation-delay: .28s; }
  .card .idx { font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; color: var(--faint); }
  .card .n {
    font-family: var(--disp); font-weight: 700; font-size: 32px; line-height: 1.1;
    letter-spacing: -.01em; margin: 3px 0 2px; font-variant-numeric: tabular-nums;
  }
  .card.green .n { color: var(--green); }
  .card.red .n { color: var(--red); }
  .card.amber .n { color: var(--amber); }
  .card .t { font-size: 12.5px; color: var(--muted); }
  .card .en { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; color: var(--faint); margin-top: 3px; text-transform: uppercase; }

  /* ---------- 同步控制台 ---------- */
  .syncbox {
    background: linear-gradient(180deg, var(--panel), #101319);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 13px 16px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    animation: rise .5s .32s cubic-bezier(.2,.7,.2,1) both;
  }
  .sync-label { flex: none; padding-right: 16px; border-right: 1px solid var(--line); }
  .sync-label .lab-en { font-family: var(--mono); font-size: 9px; letter-spacing: .22em; color: var(--amber); }
  .sync-label .lab-cn { font-size: 13px; font-weight: 600; margin-top: 1px; }
  .sync-actions { display: flex; gap: 8px; }
  .syncbox .hint { color: var(--faint); font-size: 11.5px; }
  .syncbox .hint code { font-family: var(--mono); color: var(--muted); background: rgba(255,255,255,.05);
                        padding: 1px 5px; border-radius: 3px; font-size: 10.5px; }
  .syncbox .hint b { color: var(--muted); font-weight: 500; font-family: var(--mono); font-size: 11px; }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 4px; }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    border-radius: 0; color: var(--muted); padding: 10px 14px;
    font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
  }
  .tabs button:hover { background: none; border-bottom-color: var(--line-strong); color: var(--ink); }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--amber); }
  .tab-n {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    min-width: 22px; text-align: center; padding: 1px 6px;
    background: var(--raise); border: 1px solid var(--line); border-radius: 3px;
    font-variant-numeric: tabular-nums;
  }
  .tabs button.active .tab-n { color: var(--amber); background: var(--amber-soft); border-color: var(--amber-line); }

  .panel {
    background: linear-gradient(180deg, var(--panel), #101319);
    border: 1px solid var(--line); border-top: none;
    border-radius: 0 0 8px 8px; min-height: 320px; overflow: hidden;
  }
  .panel > * { animation: fade .28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
  th {
    font-family: var(--mono); font-weight: 500; font-size: 9.5px; letter-spacing: .18em;
    color: var(--faint); text-transform: uppercase;
    background: rgba(255,255,255,.02); position: sticky; top: 0;
  }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: rgba(255,176,32,.035); }
  tbody tr:last-child td { border-bottom: none; }
  td strong { font-weight: 600; }
  .detail { color: var(--faint); font-size: 11.5px; margin-top: 2px; line-height: 1.5; }

  .badge {
    display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .03em;
    padding: 2px 7px; border-radius: 4px; border: 1px solid; white-space: nowrap;
  }
  .b-codex { color: var(--green); background: var(--green-soft); border-color: rgba(85,224,143,.28); }
  .b-claude { color: var(--violet); background: var(--violet-soft); border-color: rgba(192,140,255,.28); }
  .b-workbuddy { color: var(--pink); background: var(--pink-soft); border-color: rgba(244,120,184,.28); }
  .b-trae { color: var(--blue); background: var(--blue-soft); border-color: rgba(106,166,255,.28); }

  .st { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 4px; white-space: nowrap;
        border: 1px solid var(--line); color: var(--muted); background: rgba(255,255,255,.03); }
  .st-fork, .st-broken-link, .st-missing-target, .st-managed-foreign, .st-missing-canonical
    { color: var(--red); background: var(--red-soft); border-color: rgba(255,95,86,.3); }
  .st-unregistered, .st-duplicate
    { color: var(--amber); background: var(--amber-soft); border-color: var(--amber-line); }
  .st-synced-copy { color: var(--blue); background: var(--blue-soft); border-color: rgba(106,166,255,.3); }
  .st-managed-ok { color: var(--green); background: var(--green-soft); border-color: rgba(85,224,143,.3); }
  .st-ignored { color: var(--faint); }

  .row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .row-actions button { padding: 4px 11px; font-size: 11.5px; }

  .empty { padding: 70px 20px; text-align: center; color: var(--faint); }
  .empty .glyph { font-family: var(--disp); font-size: 26px; color: var(--line-strong); letter-spacing: .2em; margin-bottom: 12px; }
  .empty .et { font-size: 13px; color: var(--muted); }
  .empty .es { font-family: var(--mono); font-size: 9.5px; letter-spacing: .24em; color: var(--faint); margin-top: 4px; }

  pre.out {
    background: #090a0d; color: #cdd5e3; border: 1px solid var(--line); border-radius: 6px;
    padding: 13px 14px; font-family: var(--mono); font-size: 11.5px; line-height: 1.7;
    max-height: 340px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin: 10px 0 0;
  }
  .diff-add { background: rgba(85,224,143,.11); color: #9ff0c0; display: block; margin: 0 -14px; padding: 0 14px; }
  .diff-del { background: rgba(255,95,86,.11); color: #ffa39d; display: block; margin: 0 -14px; padding: 0 14px; }
  .diff-hunk { color: var(--blue); display: block; }

  /* ---------- 模态框 ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(6,7,9,.66); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px;
  }
  .modal-mask.show { display: flex; animation: fade .18s ease both; }
  .modal {
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 10px;
    width: min(820px, 94vw); max-height: 86vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .modal-mask.show .modal { animation: pop .22s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
  .modal h3 {
    margin: 0; padding: 15px 20px; border-bottom: 1px solid var(--line);
    font-family: var(--mono); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px;
  }
  .modal h3::before { content: ""; width: 7px; height: 7px; background: var(--amber); border-radius: 1px; flex: none; }
  .modal .body { padding: 18px 20px; overflow: auto; }
  .modal .foot {
    padding: 12px 20px; border-top: 1px solid var(--line);
    display: flex; justify-content: flex-end; gap: 8px; background: rgba(255,255,255,.02);
  }
  .modal label.ck { display: inline-flex; gap: 7px; align-items: center; margin-right: 16px;
                    font-size: 13px; color: var(--ink); cursor: pointer; }
  .modal label.ck input { accent-color: var(--amber); }
  .modal .warn {
    background: var(--amber-soft); border: 1px solid var(--amber-line); color: #f0c777;
    border-radius: 6px; padding: 9px 12px; font-size: 12px; margin: 12px 0 0;
  }
  .meta-line { color: var(--muted); font-size: 11.5px; margin-bottom: 10px; font-family: var(--mono); }
  .skill-view {
    font-family: var(--mono); font-size: 11.5px; line-height: 1.7; white-space: pre-wrap;
    background: #090a0d; border: 1px solid var(--line); border-radius: 6px;
    padding: 14px; max-height: 60vh; overflow: auto; color: #cdd5e3;
  }

  /* ---------- Toast ---------- */
  #toasts { position: fixed; right: 18px; bottom: 18px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    position: relative; background: var(--raise2); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 7px;
    padding: 10px 16px 10px 18px; font-size: 12.5px; max-width: 440px;
    box-shadow: 0 12px 36px rgba(0,0,0,.5);
    animation: toast-in .25s cubic-bezier(.2,.8,.2,1) both;
  }
  .toast::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
                   border-radius: 2px; background: var(--blue); }
  .toast.err { border-color: rgba(255,95,86,.4); } .toast.err::before { background: var(--red); }
  .toast.ok { border-color: rgba(85,224,143,.35); } .toast.ok::before { background: var(--green); }
  @keyframes toast-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

  .foot-note {
    margin-top: 26px; text-align: center;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; color: var(--faint);
  }

  @media (max-width: 980px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .scan-time, .chip { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="mark" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <circle cx="8" cy="8" r="4.6"/>
        <path d="M8 .8v3M8 12.2v3M.8 8h3M12.2 8h3"/>
        <circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div>
      <div class="wm-name">SKILLSYNC</div>
      <div class="wm-sub">本机技能分发控制台 · LOCAL CONSOLE</div>
    </div>
    <span class="spacer"></span>
    <span class="chip" id="repo"><span class="pulse"></span>加载中…</span>
    <span class="scan-time" id="lastScan"></span>
    <button id="refreshBtn">↻ 刷新对账</button>
  </div>
</header>

<main>
  <div class="cards" id="cards"></div>

  <div class="syncbox">
    <div class="sync-label">
      <div class="lab-en">DISPATCH</div>
      <div class="lab-cn">同步下发</div>
    </div>
    <div class="sync-actions">
      <button id="applyDry">预演 · dry-run</button>
      <button id="applyWriteLink" class="primary">执行 apply --write --link</button>
    </div>
    <span class="hint">实体副本先改名 <code>.bak-时间戳</code>，分叉内容安全拒绝。最近执行：<b id="lastApply">无</b></span>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="pending" class="active">待采纳<span class="tab-n" id="cnt-pending">0</span></button>
    <button data-tab="problems">问题与分叉<span class="tab-n" id="cnt-problems">0</span></button>
    <button data-tab="managed">已纳管 / 忽略<span class="tab-n" id="cnt-managed">0</span></button>
    <button data-tab="library">技能库<span class="tab-n" id="cnt-library">0</span></button>
  </div>
  <div class="panel" id="panel"></div>

  <div class="foot-note">127.0.0.1 ONLY · 唯一事实源 CANONICAL · 写操作经 AUDIT.LOGL 留痕 · 网页只读不编辑</div>
</main>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="body" id="modalBody"></div>
    <div class="foot" id="modalFoot"></div>
  </div>
</div>
<div id="toasts"></div>

<script>
"use strict";
const PLATFORMS = ["codex", "claude", "workbuddy", "trae"];
const PROBLEM_STATUSES = ["fork", "broken-link", "missing-target", "managed-foreign", "missing-canonical"];
const STATUS_TEXT = {
  "managed-ok": "已纳管（软链）", "synced-copy": "内容一致副本", "fork": "已分叉",
  "unregistered": "未登记", "duplicate": "内容重复", "missing-target": "平台缺失",
  "managed-foreign": "仓外软链", "broken-link": "软链失效",
  "missing-canonical": "缺 canonical", "ignored": "已忽略"
};
let DATA = null;

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jstr = v => JSON.stringify(v).replace(/"/g, "&quot;");

function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json();
  if (!data.ok && res.status >= 400 && path.startsWith("/api/") && !path.includes("/scan"))
    throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

async function refresh() {
  const d = await api("/api/scan");
  DATA = d;
  render();
  $("#lastScan").textContent = "SCAN " + new Date().toLocaleTimeString();
}

function groupByStatus() {
  const g = {};
  for (const f of DATA.findings) (g[f.status] ||= []).push(f);
  return g;
}

function renderCards() {
  const s = DATA.summary;
  const cards = [
    ["canonical 技能", DATA.canonical_count, "", "CANONICAL"],
    ["已纳管软链", s["managed-ok"] || 0, "green", "LINKED"],
    ["需处理问题", DATA.problem_total, DATA.problem_total ? "red" : "", "SIGNALS"],
    ["可采纳 / 转链", (s["unregistered"] || 0) + (s["duplicate"] || 0) + (s["synced-copy"] || 0), "amber", "PENDING"],
    ["平台内置（跳过）", DATA.builtin_counts ? Object.values(DATA.builtin_counts).reduce((a, b) => a + b, 0) : 0, "", "BUILT-IN"]
  ];
  $("#cards").innerHTML = cards.map((c, i) =>
    `<div class="card ${c[2]}"><div class="idx">0${i + 1}/05</div><div class="n">${c[1]}</div><div class="t">${c[0]}</div><div class="en">${c[3]}</div></div>`
  ).join("");
  $("#repo").innerHTML = `<span class="pulse"></span>${esc(DATA.repo_root)}`;
  const la = DATA.state?.last_apply;
  $("#lastApply").textContent = la?.time ? `${la.time}（变更 ${la.changed ?? "?"}）` : "无";
}

function renderTabCounts(g) {
  const pending = (g["unregistered"] || []).length + (g["duplicate"] || []).length + (g["synced-copy"] || []).length;
  const problems = PROBLEM_STATUSES.reduce((n, st) => n + (g[st] || []).length, 0);
  const managed = (g["managed-ok"] || []).length + (g["ignored"] || []).length;
  const library = new Set((g["managed-ok"] || []).map(f => f.name)).size;
  $("#cnt-pending").textContent = pending;
  $("#cnt-problems").textContent = problems;
  $("#cnt-managed").textContent = managed;
  $("#cnt-library").textContent = library;
}

function badge(p) { return `<span class="badge b-${p}">${p}</span>`; }
function stCell(f) { return `<span class="st st-${f.status}">${STATUS_TEXT[f.status] || f.status}</span>`; }
function emptyBlock(glyph, text, sub) {
  return `<div class="empty"><div class="glyph">${glyph}</div><div class="et">${text}</div><div class="es">${sub}</div></div>`;
}

function render() {
  const g = groupByStatus();
  renderCards();
  renderTabCounts(g);
  const tab = $("#tabs button.active").dataset.tab;
  if (tab === "pending") renderPending(g);
  else if (tab === "problems") renderProblems(g);
  else if (tab === "managed") renderManaged(g);
  else renderLibrary();
}

function renderPending(g) {
  const rows = [
    ...(g["unregistered"] || []), ...(g["duplicate"] || []), ...(g["synced-copy"] || [])
  ];
  if (!rows.length) { $("#panel").innerHTML = emptyBlock("———", "没有待采纳的技能", "NO PENDING SIGNALS"); return; }
  $("#panel").innerHTML = `<table><thead><tr>
    <th style="width:96px">平台 / PLATFORM</th><th>技能 / SKILL</th><th style="width:230px">操作 / ACTIONS</th>
    </tr></thead><tbody>${rows.map(f => `<tr>
      <td>${badge(f.platform)}</td>
      <td><strong>${esc(f.name)}</strong><div class="detail">${esc(f.detail)}</div></td>
      <td><div class="row-actions">
        <button class="primary" onclick="openAdopt('${f.platform}', ${jstr(f.name)})">采纳…</button>
        <button onclick="ignoreOne('${f.platform}', ${jstr(f.name)})">忽略</button>
      </div></td></tr>`).join("")}</tbody></table>`;
}

function renderProblems(g) {
  let html = "";
  for (const status of PROBLEM_STATUSES) {
    const rows = g[status] || [];
    if (!rows.length) continue;
    html += rows.map(f => `<tr>
      <td>${f.platform === "-" ? "" : badge(f.platform)}</td>
      <td><strong>${esc(f.name)}</strong><div class="detail">${esc(f.detail)}</div></td>
      <td>${stCell(f)}</td>
      <td><div class="row-actions">${problemActions(f)}</div></td></tr>`).join("");
  }
  $("#panel").innerHTML = html
    ? `<table><thead><tr><th style="width:96px">平台 / PLATFORM</th><th>技能 / SKILL</th><th style="width:120px">状态 / STATUS</th><th style="width:260px">操作 / ACTIONS</th></tr></thead><tbody>${html}</tbody></table>`
    : emptyBlock("✓", "没有需要处理的问题", "ALL SYSTEMS NOMINAL");
}

function problemActions(f) {
  const nm = jstr(f.name);
  if (f.status === "fork")
    return `<button onclick="openDiff('${f.platform}', ${nm})">查看差异</button>
      <button onclick="resolveOne('${f.platform}', ${nm}, 'canonical')">以仓为准</button>
      <button class="danger" onclick="resolveOne('${f.platform}', ${nm}, 'platform')">以平台为准</button>`;
  if (f.status === "broken-link" || f.status === "missing-target")
    return `<button class="primary" onclick="applyOnly('${f.platform}', ${nm})">apply 修复</button>`;
  if (f.status === "managed-foreign")
    return `<button class="danger" onclick="applyForce('${f.platform}', ${nm})">强制换链</button>`;
  return "";
}

function renderManaged(g) {
  const ok = g["managed-ok"] || [];
  const ig = g["ignored"] || [];
  if (!ok.length && !ig.length) { $("#panel").innerHTML = emptyBlock("———", "暂无已纳管技能", "NOTHING LINKED"); return; }
  let html = "";
  if (ok.length) html += `<thead><tr><th style="width:96px">平台 / PLATFORM</th><th>技能 / SKILL</th><th style="width:150px">状态 / STATUS</th></tr></thead>
    <tbody>${ok.map(f => `<tr><td>${badge(f.platform)}</td><td><strong>${esc(f.name)}</strong>
    <div class="detail">${esc(f.detail)}</div></td><td>${stCell(f)}</td></tr>`).join("")}</tbody>`;
  if (ig.length) html += `<tbody>${ig.map(f => `<tr><td>${badge(f.platform)}</td>
    <td><strong>${esc(f.name)}</strong> <span class="st st-ignored">已忽略</span>
    <div class="row-actions" style="margin-top:5px"><button onclick="unignoreOne('${f.platform}', ${jstr(f.name)})">取消忽略</button></div></td><td></td></tr>`).join("")}</tbody>`;
  $("#panel").innerHTML = `<table>${html}</table>`;
}

function renderLibrary() {
  const skills = DATA.findings.filter(f => f.status === "managed-ok");
  const slugs = [...new Set(skills.map(f => f.name))].sort();
  if (!slugs.length) { $("#panel").innerHTML = emptyBlock("———", "技能库为空", "CANONICAL EMPTY"); return; }
  $("#panel").innerHTML = `<table><thead><tr><th>技能 / SLUG</th><th>已下发平台 / TARGETS</th><th style="width:150px"></th></tr></thead>
    <tbody>${slugs.map(slug => {
      const plats = [...new Set(skills.filter(f => f.name === slug).map(f => f.platform))];
      return `<tr><td><strong>${esc(slug)}</strong></td><td>${plats.map(badge).join(" ")}</td>
      <td><div class="row-actions"><button onclick="viewSkill(${jstr(slug)})">查看 SKILL.md</button></div></td></tr>`;
    }).join("")}</tbody></table>`;
}

// ---- 模态框 ----
function modal(title, bodyHtml, footHtml) {
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = bodyHtml;
  $("#modalFoot").innerHTML = footHtml;
  $("#modalMask").classList.add("show");
}
function closeModal() { $("#modalMask").classList.remove("show"); }
$("#modalMask").addEventListener("click", e => { if (e.target.id === "modalMask") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

window.openAdopt = function (platform, name) {
  const checks = PLATFORMS.map(p =>
    `<label class="ck"><input type="checkbox" value="${p}" ${p === platform ? "checked" : ""}>${p}</label>`
  ).join("");
  modal(`采纳技能：${name}`, `
    <div class="meta-line">SOURCE ${platform} · 采纳＝复制进 canonical（源目录不动）</div>
    <div>下发到：${checks}</div>
    <div style="margin-top:12px"><label class="ck"><input type="checkbox" id="adoptLink" checked>
      采纳后立即软链下发（源实体目录备份为 .bak-时间戳）</label></div>
    <div class="warn">将产生工作区改动；请在检查 diff 后自行 commit，网页不会替你提交。</div>`,
    `<button onclick="closeModal()">取消</button>
     <button class="primary" id="adoptConfirm">确认采纳</button>`);
  $("#adoptConfirm").onclick = async () => {
    const targets = [...document.querySelectorAll(".modal .body input[type=checkbox][value]")]
      .filter(c => c.checked && PLATFORMS.includes(c.value)).map(c => c.value);
    const btn = $("#adoptConfirm"); btn.disabled = true;
    try {
      const r = await api("/api/adopt", { method: "POST",
        body: { platform, name, targets, link: $("#adoptLink").checked } });
      closeModal();
      toast(`已采纳 ${r.result.slug}：${r.result.detail}`, "ok");
      await refresh();
    } catch (e) { toast(e.message, "err"); btn.disabled = false; }
  };
};

window.openDiff = async function (platform, name) {
  modal(`${name} · canonical vs ${platform}`, `<div class="meta-line">加载中…</div>`,
    `<button onclick="closeModal()">关闭</button>
     <button onclick="resolveOne('${platform}', ${jstr(name)}, 'canonical')">以仓为准（换软链）</button>
     <button class="danger" onclick="resolveOne('${platform}', ${jstr(name)}, 'platform')">以平台为准</button>`);
  try {
    const d = await api(`/api/diff?platform=${platform}&name=${encodeURIComponent(name)}`);
    const colored = d.diff.split("\n").map(l => {
      let cls = "";
      if (l.startsWith("+") && !l.startsWith("+++")) cls = "diff-add";
      else if (l.startsWith("-") && !l.startsWith("---")) cls = "diff-del";
      else if (l.startsWith("@@")) cls = "diff-hunk";
      return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l);
    }).join("\n");
    $("#modalBody").innerHTML =
      `<div class="meta-line">绿＝canonical 独有 / 红＝${platform} 独有 · 两侧文件均已备份，裁决不会丢内容</div>
       <pre class="out">${colored || "（无文本差异）"}</pre>`;
  } catch (e) { $("#modalBody").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
};

window.viewSkill = async function (slug) {
  modal(`canonical/${slug}/SKILL.md`, `<div class="meta-line">READ-ONLY · 不在网页编辑，避免产生第二事实源</div>`,
    `<button onclick="closeModal()">关闭</button>`);
  try {
    const d = await api(`/api/skill?slug=${encodeURIComponent(slug)}`);
    $("#modalBody").innerHTML = `<pre class="skill-view">${esc(d.content)}</pre>`;
  } catch (e) { $("#modalBody").innerHTML = `<div class="warn">${esc(e.message)}</div>`; }
};

window.resolveOne = async function (platform, name, winner) {
  const who = winner === "canonical" ? "以共享仓版本覆盖平台副本" : "以平台版本覆盖共享仓";
  if (!confirm(`确认裁决【${name}】？\n${who}\n两侧实体目录都会先备份为 .bak-时间戳，随后原位换成软链。`)) return;
  try {
    const r = await api("/api/resolve", { method: "POST", body: { platform, name, winner } });
    closeModal(); toast(`裁决完成：${r.result.detail}`, "ok"); await refresh();
  } catch (e) { toast(e.message, "err"); }
};

window.ignoreOne = async function (platform, name) {
  try { await api("/api/ignore", { method: "POST", body: { platform, name } });
    toast(`已忽略 ${platform}/${name}`, "ok"); await refresh();
  } catch (e) { toast(e.message, "err"); }
};
window.unignoreOne = async function (platform, name) {
  try { await api("/api/ignore", { method: "POST", body: { platform, name, remove: true } });
    toast("已取消忽略", "ok"); await refresh();
  } catch (e) { toast(e.message, "err"); }
};

async function runApply(write, link, force, platform, only) {
  const label = write ? "这会实际改动平台目录（实体目录先备份）。确认执行？" : "预演不会改动任何文件。";
  if (!confirm(label)) return;
  try {
    const r = await api("/api/apply", { method: "POST",
      body: { write, link, force, platform: platform || null, only: only || null } });
    const lines = r.actions.map(a => `[${a.platform}] ${a.slug} ${a.kind} — ${a.detail}`);
    modal(write ? "apply 执行结果" : "apply 预演结果",
      `<div class="meta-line">${r.refused.length ? r.refused.length + " 项被安全拒绝" : "全部可执行 · ALL CLEAR"}</div>
       <pre class="out">${esc(lines.join("\n") || "（无动作）")}</pre>`,
      `<button onclick="closeModal()">关闭</button>`);
    if (write) await refresh();
  } catch (e) { toast(e.message, "err"); }
}
window.applyOnly = (p, n) => runApply(true, true, false, p, n);
window.applyForce = (p, n) => runApply(true, true, true, p, n);

$("#applyDry").onclick = () => runApply(false, true, false);
$("#applyWriteLink").onclick = () => runApply(true, true, false);
$("#refreshBtn").onclick = refresh;
$("#tabs").addEventListener("click", e => {
  if (e.target.dataset.tab) {
    document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    render();
  }
});

refresh().catch(e => toast("初始扫描失败：" + e.message, "err"));
</script>
</body>
</html>
