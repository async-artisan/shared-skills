<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skillsync 控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1e1e1e;
    --bg-deep: #181818;
    --panel: #252526;
    --panel-2: #2d2d30;
    --raise: #2a2d2e;
    --ink: #d4d4d4;
    --ink-soft: #cccccc;
    --muted: #9d9d9d;
    --faint: #6e6e6e;
    --line: #3c3c3c;
    --line-strong: #4c4c4c;
    --accent: #007acc;
    --accent-soft: #0e639c;
    --amber: #cca700;
    --amber-fill: #f39c12;
    --amber-soft: rgba(243,156,18,.14);
    --amber-line: rgba(243,156,18,.4);
    --green: #6a9955;
    --green-soft: rgba(106,153,85,.14);
    --green-line: rgba(106,153,85,.4);
    --red: #f48771;
    --red-soft: rgba(244,135,113,.12);
    --red-line: rgba(244,135,113,.4);
    --blue: #569cd6;
    --blue-soft: rgba(86,156,214,.14);
    --blue-line: rgba(86,156,214,.4);
    --violet: #c586c0;
    --violet-soft: rgba(197,134,192,.14);
    --violet-line: rgba(197,134,192,.4);
    --pink: #f48771;
    --pink-soft: rgba(244,135,113,.14);
    --pink-line: rgba(244,135,113,.4);
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", monospace;
    --disp: "Martian Mono", "IBM Plex Mono", ui-monospace, monospace;
    --sans: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { height: 100%; }
  body { margin: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column; font: 14px/1.6 var(--sans); background: var(--bg); color: var(--ink); }
  ::selection { background: rgba(0,122,204,.4); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #4c4c4c; }
  ::-webkit-scrollbar-thumb:hover { background: #5c5c5c; }
  ::-webkit-scrollbar-track { background: transparent; }
  header { flex: none; height: 32px; z-index: 20; background: var(--bg-deep); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 10px; gap: 10px; }
  .mark { width: 20px; height: 20px; flex: none; border-radius: 3px; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .mark svg { width: 12px; height: 12px; }
  .wm-name { font-family: var(--disp); font-weight: 700; font-size: 12.5px; letter-spacing: .04em; color: var(--ink); }
  .wm-sub { display: none; }
  .spacer { flex: 1; }
  .chip { font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); border-radius: 2px; padding: 2px 8px; display: inline-flex; align-items: center; gap: 6px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; box-shadow: 0 0 0 0 rgba(106,153,85,.5); animation: pulse 2.2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(106,153,85,.5); } 70% { box-shadow: 0 0 0 5px rgba(106,153,85,0); } 100% { box-shadow: 0 0 0 0 rgba(106,153,85,0); } }
  .scan-time { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  button { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink-soft); background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 2px; padding: 4px 10px; cursor: pointer; transition: background .1s, border-color .1s; display: inline-flex; align-items: center; justify-content: center; line-height: 1; vertical-align: middle; }
  button:hover { background: var(--raise); border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent-soft); }
  button.danger { color: var(--red); border-color: var(--red-line); background: var(--red-soft); }
  button.danger:hover { background: rgba(244,135,113,.2); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #refreshBtn { background: transparent; color: var(--muted); border-color: var(--line); font-family: var(--mono); font-size: 12px; padding: 2px 8px; }
  #refreshBtn:hover { color: var(--accent); border-color: var(--accent); }
  .workbench { flex: 1 1 auto; min-height: 0; display: flex; }
  .activitybar { flex: none; width: 52px; background: var(--bg-deep); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: stretch; }
  .tabs { flex-direction: column; gap: 0; padding: 0; border: none; }
  .tabs button { background: none; border: 0; border-left: 2px solid transparent; margin: 0; border-radius: 0; color: var(--muted); padding: 10px 0 8px; font-size: 11.5px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 3px; letter-spacing: .02em; }
  .tabs button::before { content: attr(data-icon); font-size: 16px; line-height: 1; }
  .tabs button:hover { background: var(--panel-2); color: var(--ink); }
  .tabs button.active { color: var(--ink); border-left-color: var(--accent); background: var(--panel); }
  .tab-n { font-family: var(--mono); font-size: 11px; color: var(--faint); min-width: 17px; text-align: center; padding: 0 4px; height: 15px; line-height: 15px; background: var(--panel-2); border-radius: 8px; font-variant-numeric: tabular-nums; }
  .tabs button.active .tab-n { color: var(--accent); background: var(--accent-soft); }
  .mainarea { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .cards { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--panel); border-bottom: 1px solid var(--line); }
  .card { padding: 6px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; }
  .card:last-child { border-right: none; }
  .card .idx { font-family: var(--mono); font-size: 11px; letter-spacing: .15em; color: var(--faint); }
  .card .n { font-family: var(--disp); font-weight: 700; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink); }
  .card.green .n { color: var(--green); }
  .card.red .n { color: var(--red); }
  .card.amber .n { color: var(--amber-fill); }
  .card .t { font-size: 12.5px; color: var(--muted); }
  .card .en { display: none; }
  .syncbox { flex: none; background: var(--panel-2); border-bottom: 1px solid var(--line); padding: 5px 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sync-label { display: flex; align-items: baseline; gap: 8px; }
  .sync-label .lab-en { font-family: var(--mono); font-size: 11.5px; letter-spacing: .15em; color: var(--amber); }
  .sync-label .lab-cn { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .sync-actions { display: flex; gap: 6px; }
  .syncbox .hint { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  .syncbox .hint code { font-family: var(--mono); color: var(--blue); font-size: 12px; }
  .syncbox .hint b { color: var(--amber); font-weight: 600; font-family: var(--mono); font-size: 12px; }
  .tabs-hint { flex: none; padding: 4px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .tabs-hint::before { content: "›"; color: var(--accent); margin-right: 6px; font-weight: 700; }
  .toolbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .toolbar input[type="search"] { flex: 1; min-width: 160px; font: 13.5px var(--mono); color: var(--ink); background: var(--bg-deep); border: 1px solid var(--line); border-radius: 2px; padding: 5px 10px; outline: none; }
  .toolbar input[type="search"]:focus { border-color: var(--accent); }
  .toolbar select { font: 13px var(--mono); color: var(--ink-soft); background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 2px; padding: 4px 8px; }
  .filter-info { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .panel { flex: 1 1 auto; min-height: 0; overflow: auto; background: var(--bg); }
  .tbl-wrap { padding: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th { position: sticky; top: 0; z-index: 2; background: var(--panel-2); color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .05em; text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--line-strong); text-transform: uppercase; }
  tbody td { padding: 5px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr strong { color: var(--ink); font-weight: 600; }
  .detail { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 2px; }
  .detail.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 2px; border: 1px solid var(--line); display: inline-block; }
  .b-codex { color: var(--green); background: var(--green-soft); border-color: var(--green-line); }
  .b-claude { color: var(--amber); background: var(--amber-soft); border-color: var(--amber-line); }
  .b-workbuddy { color: var(--blue); background: var(--blue-soft); border-color: var(--blue-line); }
  .b-trae { color: var(--violet); background: var(--violet-soft); border-color: var(--violet-line); }
  .st { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 2px; border: 1px solid var(--line); display: inline-block; white-space: nowrap; }
  .st-managed-ok { color: var(--green); background: var(--green-soft); border-color: var(--green-line); }
  .st-synced-copy { color: var(--blue); background: var(--blue-soft); border-color: var(--blue-line); }
  .st-fork, .st-broken-link, .st-missing-target, .st-managed-foreign { color: var(--red); background: var(--red-soft); border-color: var(--red-line); }
  .st-missing-canonical, .st-bad-frontmatter { color: var(--amber); background: var(--amber-soft); border-color: var(--amber-line); }
  .st-unregistered, .st-duplicate { color: var(--blue); background: var(--blue-soft); border-color: var(--blue-line); }
  .st-ignored { color: var(--faint); background: transparent; border-color: var(--line); }
  .st-archived { color: var(--muted); background: var(--panel-2); border-color: var(--line); }
  .row-actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .row-actions button { padding: 3px 8px; font-size: 12.5px; }
  .cell-badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
  .empty .glyph { font-size: 32px; color: var(--faint); margin-bottom: 8px; }
  .empty .et { font-size: 15px; color: var(--ink-soft); }
  .empty .es { font-family: var(--mono); font-size: 12px; color: var(--faint); margin-top: 4px; letter-spacing: .1em; }
  .meta-line { font-family: var(--mono); font-size: 12.5px; color: var(--muted); padding: 6px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
  .warn { color: var(--red); font-family: var(--mono); font-size: 13px; padding: 8px 12px; background: var(--red-soft); border-radius: 2px; }
  .muted { color: var(--muted); }
  .pager-bar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .pager-info b { color: var(--ink); font-family: var(--mono); }
  .pager-size { font: 12.5px var(--mono); color: var(--ink-soft); background: var(--panel-2); border: 1px solid var(--line); padding: 2px 6px; border-radius: 2px; }
  .pager-pages { display: flex; gap: 2px; align-items: center; }
  .pg { padding: 2px 7px; font-size: 12.5px; font-family: var(--mono); background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer; border-radius: 2px; }
  .pg:hover { border-color: var(--accent); }
  .pg.cur { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pg.ellipsis { background: none; border: none; cursor: default; }
  .statusbar { flex: none; height: 24px; background: var(--accent); color: #fff; display: flex; align-items: center; padding: 0 10px; gap: 12px; font-family: var(--mono); font-size: 12px; }
  .statusbar .sep { opacity: .4; }
  .statusbar .sb-right { margin-left: auto; display: flex; gap: 10px; opacity: .85; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; display: none; align-items: center; justify-content: center; }
  .modal-mask.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 4px; width: min(680px, 92vw); max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 16px 48px rgba(0,0,0,.5); }
  .modal h3 { margin: 0; padding: 10px 16px; font-size: 14.5px; font-weight: 600; border-bottom: 1px solid var(--line); color: var(--ink); }
  .modal .body { padding: 14px 16px; overflow: auto; flex: 1; min-height: 0; }
  .modal .foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; background: var(--panel-2); }
  .modal input[type="text"], .modal input:not([type]) { font: 13.5px var(--mono); color: var(--ink); background: var(--bg-deep); border: 1px solid var(--line); border-radius: 2px; padding: 6px 10px; outline: none; }
  .modal input:focus { border-color: var(--accent); }
  .ck { display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; color: var(--ink-soft); margin-right: 12px; cursor: pointer; }
  .ck input { accent-color: var(--accent); }
  .md-body { font-size: 14.5px; line-height: 1.7; color: var(--ink-soft); }
  .md-body h1, .md-body h2, .md-body h3 { color: var(--ink); margin: 16px 0 8px; }
  .md-body h1 { font-size: 20px; }
  .md-body h2 { font-size: 16.5px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .md-body code { font-family: var(--mono); background: var(--bg-deep); padding: 1px 5px; border-radius: 2px; font-size: 13px; color: var(--amber); }
  .md-body pre { background: var(--bg-deep); padding: 10px; border-radius: 2px; overflow: auto; border: 1px solid var(--line); }
  .md-body pre code { background: none; padding: 0; color: var(--ink); }
  .md-body blockquote { border-left: 3px solid var(--accent); margin: 8px 0; padding: 4px 12px; color: var(--muted); background: var(--panel-2); }
  .md-body table { border-collapse: collapse; margin: 8px 0; }
  .md-body th, .md-body td { border: 1px solid var(--line); padding: 4px 10px; }
  .md-body th { background: var(--panel-2); }
  .md-fm summary { font-family: var(--mono); font-size: 12.5px; color: var(--accent); cursor: pointer; }
  .md-fm pre { margin: 6px 0; font-size: 12.5px; }
  .view-toggle { float: right; display: flex; gap: 4px; }
  .view-toggle button { padding: 2px 8px; font-size: 12px; }
  .view-toggle button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .skill-view { font-family: var(--mono); font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; background: var(--bg-deep); padding: 12px; border-radius: 2px; border: 1px solid var(--line); }
  .diff-add { color: var(--green); }
  .diff-del { color: var(--red); }
  .diff-hunk { color: var(--violet); }
  .cmp-tbl th, .cmp-tbl td { font-size: 12.5px; padding: 4px 8px; }
  .cmp-diff summary { font-family: var(--mono); font-size: 12.5px; color: var(--accent); cursor: pointer; margin: 8px 0 4px; }
  .out { font-family: var(--mono); font-size: 13px; line-height: 1.55; background: var(--bg-deep); padding: 10px; border-radius: 2px; border: 1px solid var(--line); overflow: auto; max-height: 320px; white-space: pre-wrap; }
  .hist-time { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  #toasts { position: fixed; bottom: 32px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 6px; }
  .toast { background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 2px; padding: 8px 14px; font-size: 13.5px; color: var(--ink); box-shadow: 0 4px 16px rgba(0,0,0,.4); animation: slidein .2s ease; }
  .toast.ok { border-left: 3px solid var(--green); }
  .toast.err { border-left: 3px solid var(--red); }
  @keyframes slidein { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @media (max-width: 720px) { .activitybar { width: 44px; } .tabs button { font-size: 0; } .tabs button::before { font-size: 18px; } }

  /* ---------- 亮色主题 ---------- */
  body.light {
    color-scheme: light;
    --bg: #f5f5f7;
    --bg-deep: #ffffff;
    --panel: #ffffff;
    --panel-2: #fafafa;
    --raise: #f0f0f0;
    --ink: #1a1a1a;
    --ink-soft: #333333;
    --muted: #6b6b6b;
    --faint: #a0a0a0;
    --line: #e5e5e8;
    --line-strong: #d0d0d5;
    --accent: #007acc;
    --accent-soft: #cce4f4;
    --amber: #b8860b;
    --amber-fill: #d97706;
    --amber-soft: rgba(217,119,6,.10);
    --amber-line: rgba(217,119,6,.35);
    --green: #166534;
    --green-soft: rgba(22,101,52,.08);
    --green-line: rgba(22,101,52,.3);
    --red: #b91c1c;
    --red-soft: rgba(185,28,28,.07);
    --red-line: rgba(185,28,28,.3);
    --blue: #1d4ed8;
    --blue-soft: rgba(29,78,216,.08);
    --blue-line: rgba(29,78,216,.3);
    --violet: #6d28d9;
    --violet-soft: rgba(109,40,217,.08);
    --violet-line: rgba(109,40,217,.3);
    --pink: #be185d;
    --pink-soft: rgba(190,24,93,.08);
    --pink-line: rgba(190,24,93,.3);
  }
  body.light ::-webkit-scrollbar-thumb { background: #c8c8cc; }
  body.light ::-webkit-scrollbar-thumb:hover { background: #a8a8ac; }
  body.light .toast { box-shadow: 0 4px 16px rgba(0,0,0,.12); }
</style>
</head>
<body>
<header>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
      <circle cx="8" cy="8" r="4.6"/>
      <path d="M8 .8v3M8 12.2v3M.8 8h3M12.2 8h3"/>
      <circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/>
    </svg>
  </div>
  <div class="wm-name">SKILLSYNC</div>
  <span class="spacer"></span>
  <span class="chip" id="repo"><span class="pulse"></span>加载中…</span>
  <span class="chip" id="pretransChip" hidden></span>
  <span class="scan-time" id="lastScan"></span>
  <button id="themeBtn" onclick="toggleTheme()" title="切换亮/暗主题">☀</button>
  <button id="refreshBtn">↻ REFRESH</button>
</header>

<div class="workbench">
  <nav class="activitybar">
    <div class="tabs" id="tabs">
      <button data-tab="library" data-icon="▤" class="active" title="共享仓 canonical 技能本体">技能库<span class="tab-n" id="cnt-library">0</span></button>
      <button data-tab="pending" data-icon="↓" title="平台侧新技能，待采纳">待采纳<span class="tab-n" id="cnt-pending">0</span></button>
      <button data-tab="managed" data-icon="↔" title="已纳管软链与已忽略">纳管<span class="tab-n" id="cnt-managed">0</span></button>
      <button data-tab="problems" data-icon="!" title="异常与分叉">问题<span class="tab-n" id="cnt-problems">0</span></button>
      <button data-tab="history" data-icon="⏱" title="操作审计留痕">历史<span class="tab-n" id="cnt-history">0</span></button>
    </div>
  </nav>

  <div class="mainarea">
    <div class="cards" id="cards"></div>

    <div class="syncbox">
      <div class="sync-label">
        <span class="lab-en">DISPATCH</span>
        <span class="lab-cn">同步下发</span>
      </div>
      <div class="sync-actions">
        <button id="applyDry">预演</button>
        <button id="applyWriteLink" class="primary">apply --write --link</button>
      </div>
      <span class="hint">实体先备份 <code>.bak-*</code>，分叉拒绝。最近：<b id="lastApply">无</b></span>
    </div>

    <div class="tabs-hint" id="tabsHint"></div>

    <div class="toolbar" id="toolbar">
      <input type="search" id="searchBox" placeholder="搜索名称 / 简介 / 关键词…"
             oninput="onSearch(this.value)" autocomplete="off">
      <select id="platformSel" onchange="onPlatform(this.value)" aria-label="平台筛选">
        <option value="all">全部平台</option>
      </select>
      <button id="clearFilter" onclick="clearFilters()" style="display:none">清除</button>
      <button id="importBtn" onclick="openImport()" title="从 github / skills.sh 导入">导入</button>
      <span class="filter-info" id="filterInfo"></span>
    </div>

    <div class="panel" id="panel"></div>

    <div class="statusbar">
      <span id="sbRepo">—</span>
      <span class="sep">│</span>
      <span>127.0.0.1</span>
      <span class="sep">│</span>
      <span>CANONICAL 唯一事实源</span>
      <div class="sb-right">
        <span>AUDIT.LOGL 留痕</span>
        <span class="sep">│</span>
        <span>只读不编辑</span>
      </div>
    </div>
  </div>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="body" id="modalBody"></div>
    <div class="foot" id="modalFoot"></div>
  </div>
</div>
<div id="toasts"></div>
<script>
"use strict";
// 主题：暗色默认，亮色通过 body.light 切换；偏好存 localStorage
function applyTheme(t) {
  const isLight = t === "light";
  document.body.classList.toggle("light", isLight);
  const btn = document.getElementById("themeBtn");
  if (btn) btn.textContent = isLight ? "☾" : "☀";
}
function toggleTheme() {
  const cur = document.body.classList.contains("light") ? "light" : "dark";
  const next = cur === "light" ? "dark" : "light";
  localStorage.setItem("skillsync-theme", next);
  applyTheme(next);
}
applyTheme(localStorage.getItem("skillsync-theme") || "dark");

// 平台清单：首屏用内置默认，/api/scan 返回后按生效配置覆盖（自定义平台无需改前端）
const KNOWN_BADGE = new Set(["codex", "claude", "workbuddy", "trae"]);
let PLATFORMS = ["codex", "claude", "workbuddy", "trae"];
let PLATFORM_LABELS = {};
// 自定义平台徽章配色：按配置顺序分配，与四个内置平台色板错开
const EXTRA_BADGE = [
  ["#0f766e", "#e6f5f3", "#b2ddd8"], ["#0e6fa8", "#e7f3fb", "#b5d9ee"],
  ["#4f46a5", "#ececfb", "#c9c6ec"], ["#be4b5e", "#fdeef0", "#f3c6ce"],
  ["#4d7c0f", "#f1f8e3", "#d3e7a8"], ["#b45309", "#fdf0e3", "#f0cfa3"],
  ["#475569", "#eef1f5", "#c7d0db"], ["#0d8a8a", "#e4f7f4", "#aedcd4"],
];
let BADGE_STYLE = {};
const PLATFORM_SOURCE_TEXT = {
  "default": "内置默认（codex / claude / workbuddy / trae）",
  "repo": "仓库配置 registry/platforms.yaml",
  "user": "个人配置 ~/.skillsync/platforms.yaml",
  "env": "环境变量 SKILLSYNC_PLATFORMS",
};

// 按后端返回的生效平台重建筛选下拉与徽章配色；选中项消失时安全回退到「全部平台」
function syncPlatforms(list, source) {
  if (Array.isArray(list) && list.length) {
    PLATFORMS = list.map(p => p.key);
    PLATFORM_LABELS = {};
    for (const p of list) PLATFORM_LABELS[p.key] = p.label || p.key;
  }
  BADGE_STYLE = {};
  let ei = 0;
  for (const p of PLATFORMS) {
    if (!KNOWN_BADGE.has(p)) BADGE_STYLE[p] = EXTRA_BADGE[ei++ % EXTRA_BADGE.length];
  }
  const sel = $("#platformSel");
  const prev = sel.value || "all";
  sel.innerHTML = `<option value="all">全部平台</option>` + PLATFORMS.map(p =>
    `<option value="${p}">${PLATFORM_LABELS[p] && PLATFORM_LABELS[p] !== p
      ? esc(PLATFORM_LABELS[p]) + " · " + p : p}</option>`).join("");
  if (prev === "all" || PLATFORM_LABELS[prev]) {
    sel.value = prev;
  } else {
    sel.value = "all";
    platformFilter = "all";
  }
  sel.title = "平台清单来源：" + (PLATFORM_SOURCE_TEXT[source] || source || "内置默认");
}
const PROBLEM_STATUSES = ["fork", "broken-link", "missing-target", "managed-foreign", "missing-canonical", "bad-frontmatter"];
const PAGE_SIZES = [15, 30, 50];
const STATUS_TEXT = {
  "managed-ok": "已纳管（软链）", "synced-copy": "内容一致副本", "fork": "已分叉",
  "unregistered": "未登记", "duplicate": "内容重复", "missing-target": "平台缺失",
  "managed-foreign": "仓外软链", "broken-link": "软链失效",
  "missing-canonical": "缺 canonical", "bad-frontmatter": "元数据异常", "ignored": "已忽略"
};
let DATA = null;
// 归档集合：catalog.archived 的技能（其异常/待采纳行不催办，可在技能库恢复）
const ARCH = () => new Set((DATA && DATA.archived) || []);
let pageSize = 15;
const pagePos = { pending: 1, problems: 1, managed: 1, library: 1, history: 1 };

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const jstr = v => JSON.stringify(v).replace(/"/g, "&quot;");

function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json();
  if (!data.ok && res.status >= 400 && path.startsWith("/api/") && !path.includes("/scan"))
    throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

async function refresh() {
  const d = await api("/api/scan");
  DATA = d;
  syncPlatforms(d.platforms, d.platforms_source);
  HISTORY = null; // 操作可能已写入新审计记录，缓存失效
  render();
  $("#lastScan").textContent = "SCAN " + new Date().toLocaleTimeString();
  try { watchSig = (await api("/api/poll")).sig; } catch (_) {}
}

// ---- watch 自动扫描：轮询目录签名，变化即重扫（只读，不自动改任何东西） ----
let watchSig = null;
async function watchTick() {
  try {
    const d = await api("/api/poll");
    if (watchSig !== null && d.sig !== watchSig) {
      await refresh(); // refresh() 末尾会更新 watchSig 基线
      toast("检测到技能目录变化，已自动重新扫描", "ok");
      return;
    }
    watchSig = d.sig;
  } catch (_) { /* 服务短暂不可用，下轮再试 */ }
}
setInterval(watchTick, 5000);

function groupByStatus() {
  const g = {};
  for (const f of DATA.findings) (g[f.status] ||= []).push(f);
  return g;
}

function renderCards() {
  const s = DATA.summary;
  const cards = [
    ["canonical 技能", DATA.canonical_count, "", "CANONICAL"],
    ["已纳管软链", s["managed-ok"] || 0, "green", "LINKED"],
    ["需处理问题", DATA.problem_total, DATA.problem_total ? "red" : "", "SIGNALS"],
    ["可采纳 / 转链", (s["unregistered"] || 0) + (s["duplicate"] || 0) + (s["synced-copy"] || 0), "amber", "PENDING"],
    ["平台内置（跳过）", DATA.builtin_counts ? Object.values(DATA.builtin_counts).reduce((a, b) => a + b, 0) : 0, "", "BUILT-IN"]
  ];
  $("#cards").innerHTML = cards.map((c, i) =>
    `<div class="card ${c[2]}"><div class="idx">0${i + 1}/05</div><div class="n">${c[1]}</div><div class="t">${c[0]}</div><div class="en">${c[3]}</div></div>`
  ).join("");
  $("#repo").innerHTML = `<span class="pulse"></span>${esc(DATA.repo_root)}`;
  const la = DATA.state?.last_apply;
  $("#lastApply").textContent = la?.time ? `${la.time}（变更 ${la.changed ?? "?"}）` : "无";
}

function renderTabCounts(g, counts) {
  $("#cnt-pending").textContent = counts.pending;
  $("#cnt-problems").textContent = counts.problems;
  $("#cnt-managed").textContent = counts.managed;
  $("#cnt-library").textContent = counts.library;
}

function badge(p) {
  if (KNOWN_BADGE.has(p)) return `<span class="badge b-${p}">${p}</span>`;
  const c = BADGE_STYLE[p] || EXTRA_BADGE[0];
  const tip = PLATFORM_LABELS[p] ? ` title="${esc(PLATFORM_LABELS[p])}"` : "";
  return `<span class="badge"${tip} style="color:${c[0]};background:${c[1]};border-color:${c[2]}">${p}</span>`;
}
function stCell(f) { return `<span class="st st-${f.status}">${STATUS_TEXT[f.status] || f.status}</span>`; }
function emptyBlock(glyph, text, sub) {
  return `<div class="empty"><div class="glyph">${glyph}</div><div class="et">${text}</div><div class="es">${sub}</div></div>`;
}

// ---- 分页：唯一一套切片逻辑 ----
function pageSlice(rows, tab) {
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (pagePos[tab] > pages) pagePos[tab] = pages;
  if (pagePos[tab] < 1) pagePos[tab] = 1;
  const page = pagePos[tab];
  const start = (page - 1) * pageSize;
  return { items: rows.slice(start, start + pageSize), total, pages, page };
}

function pageNumbers(page, pages) {
  const out = [];
  const push = n => out.push(n);
  if (pages <= 7) { for (let i = 1; i <= pages; i++) push(i); return out; }
  push(1);
  if (page > 3) out.push("…");
  for (let i = Math.max(2, page - 1); i <= Math.min(pages - 1, page + 1); i++) push(i);
  if (page < pages - 2) out.push("…");
  push(pages);
  return out;
}

function pagerBar(tab, info) {
  const { total, pages, page } = info;
  if (!total) return "";
  const sizeSel = PAGE_SIZES.map(n =>
    `<option value="${n}" ${n === pageSize ? "selected" : ""}>${n} 条/页</option>`).join("");
  let pagesHtml = "";
  if (pages > 1) {
    pagesHtml = `<div class="pager-pages">
      <button class="pg" ${page === 1 ? "disabled" : ""} onclick="goPage('${tab}', ${page - 1})">‹</button>
      ${pageNumbers(page, pages).map(n => n === "…"
        ? `<span class="pg ellipsis">…</span>`
        : `<button class="pg ${n === page ? "cur" : ""}" onclick="goPage('${tab}', ${n})">${n}</button>`).join("")}
      <button class="pg" ${page === pages ? "disabled" : ""} onclick="goPage('${tab}', ${page + 1})">›</button>
    </div>`;
  }
  return `<div class="pager-bar">
    <span class="pager-info">共 <b>${total}</b> 条 · 第 <b>${page}</b> / ${pages} 页</span>
    <select class="pager-size" onchange="setPageSize(this.value)" aria-label="每页条数">${sizeSel}</select>
    ${pagesHtml}
  </div>`;
}

window.goPage = function (tab, n) {
  pagePos[tab] = n;
  render();
};
window.setPageSize = function (v) {
  pageSize = Number(v);
  for (const k of Object.keys(pagePos)) pagePos[k] = 1;
  render();
};

// ---- 搜索筛选 ----
let query = "";
let platformFilter = "all";

const curTab = () => $("#tabs button.active").dataset.tab;
const filtersActive = () => !!(query || platformFilter !== "all");

window.onSearch = function (v) {
  query = v.trim().toLowerCase();
  pagePos[curTab()] = 1;
  render();
};
window.onPlatform = function (v) {
  platformFilter = v;
  pagePos[curTab()] = 1;
  render();
};
window.clearFilters = function () {
  query = ""; platformFilter = "all";
  $("#searchBox").value = ""; $("#platformSel").value = "all";
  render();
};

// 平台行匹配：missing-canonical 等无平台行的 platform 为 "-"，不受平台筛选限制
function matchRow(f) {
  if (platformFilter !== "all" && f.platform !== "-" && f.platform !== platformFilter) return false;
  if (!query) return true;
  const hay = [f.name, f.detail || "", rowDesc(f), f.platform || ""].join(" ").toLowerCase();
  return query.split(/\s+/).every(t => hay.includes(t));
}

function render() {
  const tab = curTab();
  if (tab === "history") { renderHistoryTab(); return; }
  const g = groupByStatus();
  renderCards();
  // 归档语义：已归档技能的待采纳/问题行不再显示（计入 hiddenN，可在技能库恢复）
  const pendAll = [...(g["unregistered"] || []), ...(g["duplicate"] || []), ...(g["synced-copy"] || [])];
  const probAll = [];
  for (const st of PROBLEM_STATUSES) probAll.push(...(g[st] || []));
  const pendingRows = pendAll.filter(f => !f.archived);
  const problemRows = probAll.filter(f => !f.archived);
  const pendHidden = pendAll.length - pendingRows.length;
  const probHidden = probAll.length - problemRows.length;
  const managedRows = [...(g["managed-ok"] || []), ...(g["ignored"] || [])];
  const allLib = libraryRows();
  const pend = pendingRows.filter(matchRow);
  const prob = problemRows.filter(matchRow);
  const man = managedRows.filter(matchRow);
  const lib = allLib.filter(matchLibraryRow);
  renderTabCounts(g, {
    pending: pendingRows.length, problems: problemRows.length,
    managed: managedRows.length, library: allLib.length
  });
  // 筛选提示：页签计数保持全量，这里显示当前页签的匹配数
  const totals = { pending: pendingRows.length, problems: problemRows.length,
                   managed: managedRows.length, library: allLib.length };
  const shown = { pending: pend, problems: prob, managed: man, library: lib }[tab];
  $("#filterInfo").textContent =
    filtersActive() ? `FILTER ${shown.length} / ${totals[tab]}` : "";
  $("#clearFilter").style.display = filtersActive() ? "" : "none";
  // 有数据但被筛没：显示筛选空态（与真正无数据的空态区分）
  if (filtersActive() && !shown.length && totals[tab]) {
    $("#panel").innerHTML = `<div class="empty"><div class="glyph">⌕</div>
      <div class="et">没有匹配的技能</div>
      <div class="es">调整关键词或平台筛选，或 <button onclick="clearFilters()">清除筛选</button></div></div>`;
    return;
  }
  if (tab === "pending") { renderPending(pend, pendHidden); pretranslateDescs(); }
  else if (tab === "problems") renderProblems(prob, probHidden);
  else if (tab === "managed") renderManaged(man);
  else renderLibrary(lib);
}

// 行简介：优先平台侧 description（未采纳技能），其次 canonical 的
function rowDesc(f) {
  return (DATA.platform_descriptions || {})[f.platform + "/" + f.name]
      || (DATA.descriptions || {})[f.name] || "";
}
const GENERIC_PENDING_DETAIL = "平台目录中的新技能，尚未纳入共享仓";

// ---- 简介批量预翻译：进入待采纳页后，后台把英文简介逐条译中 ----
// 译文进程内即时生效；后端 /api/translate 自带磁盘缓存，重启不丢。
const DESC_ZH = new Map();  // 英文简介 -> 中文译文
const DOC_TR = new Map();   // 查看器自动预热：SKILL.md 原文 -> 翻译 promise
const PRETRANS = { started: false, running: false, paused: false, done: 0, total: 0 };
let _pretransPainted = 0;

function paintPretransChip() {
  const c = $("#pretransChip");
  if (!c) return;
  if (PRETRANS.running) {
    c.hidden = false;
    c.innerHTML = `<span class="pulse"></span>简介译中 ${PRETRANS.done}/${PRETRANS.total}`
      + (PRETRANS.paused ? "（已暂停，详情优先）" : "");
  } else {
    c.hidden = true;
  }
}

async function pretranslateDescs() {
  if (PRETRANS.started) return;
  PRETRANS.started = true;
  const g = groupByStatus();
  const pendRows = [...(g["unregistered"] || []), ...(g["duplicate"] || []), ...(g["synced-copy"] || [])];
  const uniq = [...new Set(pendRows.map(rowDesc).filter(Boolean))]
    .filter(d => isMostlyEnglish(d) && !DESC_ZH.has(d));
  if (!uniq.length) return;
  PRETRANS.running = true; PRETRANS.done = 0; PRETRANS.total = uniq.length;
  paintPretransChip();
  for (const d of uniq) {
    // 详情查看器打开时让路：离线翻译引擎单线程，交互请求优先
    while (PRETRANS.paused) await new Promise(r => setTimeout(r, 250));
    try {
      const r = await api("/api/translate", { method: "POST", body: { text: d } });
      DESC_ZH.set(d, r.translated || d);
    } catch (e) {
      toast("批量预翻译中止：" + e.message, "err");
      break;
    }
    PRETRANS.done++;
    paintPretransChip();
    const now = Date.now();
    if (curTab() === "pending" && now - _pretransPainted > 400) {
      _pretransPainted = now;
      render();  // 译文到一条刷一屏（节流），列表逐步变中文
    }
  }
  PRETRANS.running = false;
  paintPretransChip();
  if (PRETRANS.done >= PRETRANS.total)
    toast(`英文简介已批量译好（${PRETRANS.done} 条，缓存已落盘）`, "ok");
  if (curTab() === "pending") render();
}

function renderPending(rows, hiddenN = 0) {
  const hint = hiddenN > 0
    ? `<div class="meta-line">另有 ${hiddenN} 条已归档技能的记录未显示（可在技能库恢复）</div>` : "";
  if (!rows.length) {
    $("#panel").innerHTML = hint || emptyBlock("———", "没有待采纳的技能", "NO PENDING SIGNALS");
    return;
  }
  const pg = pageSlice(rows, "pending");
  $("#panel").innerHTML = hint + `<div class="tbl-wrap"><table><thead><tr>
    <th style="width:96px">平台 / PLATFORM</th><th>技能 / SKILL</th><th style="width:230px">操作 / ACTIONS</th>
    </tr></thead><tbody>${pg.items.map(f => {
      const desc = rowDesc(f);
      const shown = DESC_ZH.get(desc) || desc;
      const statusLine = f.detail === GENERIC_PENDING_DETAIL ? "" :
        `<div class="detail">${esc(f.detail)}</div>`;
      return `<tr>
      <td>${badge(f.platform)}</td>
      <td><strong>${esc(f.name)}</strong>${desc ? `<div class="detail clamp2" title="${esc(desc)}">${esc(shown)}</div>` : ""}${statusLine}</td>
      <td><div class="row-actions">
        <button onclick="viewSource('${f.platform}', ${jstr(f.name)})">查看</button>
        <button class="primary" onclick="openAdopt('${f.platform}', ${jstr(f.name)})">采纳…</button>
        <button onclick="ignoreOne('${f.platform}', ${jstr(f.name)})">忽略</button>
      </div></td></tr>`;}).join("")}</tbody></table></div>${pagerBar("pending", pg)}`;
}

function renderProblems(rows, hiddenN = 0) {
  const hint = hiddenN > 0
    ? `<div class="meta-line">另有 ${hiddenN} 条已归档技能的异常未显示（可在技能库恢复）</div>` : "";
  if (!rows.length) { $("#panel").innerHTML = hint || emptyBlock("✓", "没有需要处理的问题", "ALL SYSTEMS NOMINAL"); return; }
  const pg = pageSlice(rows, "problems");
  $("#panel").innerHTML = hint + `<div class="tbl-wrap"><table><thead><tr>
    <th style="width:96px">平台 / PLATFORM</th><th>技能 / SKILL</th><th style="width:120px">状态 / STATUS</th><th style="width:260px">操作 / ACTIONS</th>
    </tr></thead><tbody>${pg.items.map(f => `<tr>
      <td>${f.platform === "-" ? "" : badge(f.platform)}</td>
      <td><strong>${esc(f.name)}</strong><div class="detail">${esc(f.detail)}</div></td>
      <td>${stCell(f)}</td>
      <td><div class="row-actions">${problemActions(f)}</div></td></tr>`).join("")}</tbody></table></div>${pagerBar("problems", pg)}`;
}

function problemActions(f) {
  const nm = jstr(f.name);
  if (f.status === "fork")
    return `<button class="primary" onclick="openCompare('${f.platform}', ${nm})">对比 · 拉取更新</button>
      <button onclick="resolveOne('${f.platform}', ${nm}, 'canonical')">以仓为准</button>`;
  if (f.status === "broken-link" || f.status === "missing-target")
    return `<button class="primary" onclick="applyOnly('${f.platform}', ${nm})">apply 修复</button>`;
  if (f.status === "managed-foreign")
    return `<button class="danger" onclick="applyForce('${f.platform}', ${nm})">强制换链</button>`;
  if (f.status === "bad-frontmatter")
    return f.platform === "-"
      ? `<button onclick="viewSkill(${nm})">查看</button>`
      : `<button onclick="viewSource('${f.platform}', ${nm})">查看</button>`;
  return "";
}

function renderManaged(rows) {
  if (!rows.length) { $("#panel").innerHTML = emptyBlock("———", "暂无已纳管技能", "NOTHING LINKED"); return; }
  const pg = pageSlice(rows, "managed");
  $("#panel").innerHTML = `<div class="tbl-wrap"><table><thead><tr>
    <th style="width:96px">平台 / PLATFORM</th><th>技能 / SKILL</th><th style="width:170px">状态 / STATUS</th>
    </tr></thead><tbody>${pg.items.map(f => f.status === "ignored" ? `<tr>
      <td>${badge(f.platform)}</td>
      <td><strong>${esc(f.name)}</strong> <span class="st st-ignored">已忽略</span>
      <div class="row-actions" style="margin-top:5px"><button onclick="unignoreOne('${f.platform}', ${jstr(f.name)})">取消忽略</button></div></td>
      <td></td></tr>` : `<tr>
      <td>${badge(f.platform)}</td><td><strong>${esc(f.name)}</strong>${f.archived ? ` <span class="st st-archived">已归档</span>` : ""}
      ${(() => { const d = rowDesc(f); return d ? `<div class="detail clamp2" title="${esc(d)}">${esc(d)}</div>` : ""; })()}
      <div class="detail">${esc(f.detail)}</div></td><td>${stCell(f)}</td></tr>`).join("")}</tbody></table></div>${pagerBar("managed", pg)}`;
}

// 技能库行构建（render 与 renderLibrary 共用）
function libraryRows() {
  const okFinds = DATA.findings.filter(f => f.status === "managed-ok");
  const platsOf = slug => [...new Set(okFinds.filter(f => f.name === slug).map(f => f.platform))];
  return [...new Set(okFinds.map(f => f.name))].sort().map(slug =>
    ({ slug, plats: platsOf(slug), desc: (DATA.descriptions || {})[slug] || "",
       archived: ARCH().has(slug) }));
}

const ACTION_TEXT = { adopt: "采纳", resolve: "裁决", apply: "下发", ignore: "忽略", archive: "归档" };

const UNDO_MAP = {}; // id -> executed(bool)
async function ensureUndoMap() {

  (d.entries || []).forEach(u => { UNDO_MAP[u.id] = !!u.executed; });

  try {

// 历史行匹配：平台筛选按记录平台；搜索覆盖整条记录的全部字段
function matchHistoryRow(rec) {
  if (platformFilter !== "all" && rec.platform && rec.platform !== "*"
      && rec.platform !== platformFilter) return false;
  if (!query) return true;
  const hay = JSON.stringify(rec).toLowerCase();
  return query.split(/\s+/).every(t => hay.includes(t));
}

function historyDetail(rec) {
  const skip = new Set(["time", "action", "slug", "platform"]);
  return Object.entries(rec)
    .filter(([k]) => !skip.has(k))
    .map(([k, v]) => `${k}=${typeof v === "string" ? v : JSON.stringify(v)}`)
    .join(" · ");
}

function renderHistoryTab() {
  if (HISTORY) { paintHistory(HISTORY); return; }
  $("#panel").innerHTML = emptyBlock("···", "加载操作历史…", "READING AUDIT.LOGL");
  ensureHistory()
    .then(() => ensureUndoMap())
    .then(() => { if (curTab() === "history") render(); })
    .catch(e => { $("#panel").innerHTML = `<div class="warn">${esc(e.message)}</div>`; });

  if (filtersActive() && !rows.length && all.length) {
    $("#panel").innerHTML = `<div class="empty"><div class="glyph">⌕</div>

    return;

}

function renderHistory(rows) {
  if (!rows.length) { $("#panel").innerHTML = emptyBlock("———", "暂无操作记录", "AUDIT LOG EMPTY"); return; }
  const pg = pageSlice(rows, "history");
  $("#panel").innerHTML = `<div class="tbl-wrap"><table><thead><tr>
    <th style="width:175px">时间 / TIME</th><th style="width:90px">动作 / ACTION</th><th>对象与详情 / TARGET & DETAIL</th>
    </tr></thead><tbody>${pg.items.map(rec => {
      const when = (rec.time || "").replace("T", " ");
      const act = rec.action || "?";
      const plat = rec.platform === "*" ? "全部平台"
        : rec.platform && rec.platform !== "-" ? badge(rec.platform) : "";
      let undoCtl = "";
      if (rec.undo && act !== "undo") {
        const done = UNDO_MAP[rec.undo];
        undoCtl = done === undefined ? "" : done

          : ` <button style="padding:2px 10px;font-size:12.5px" onclick="undoOne('${esc(rec.undo)}')">撤销</button>`;
      }
      return `<tr>
        <td><span class="hist-time">${esc(when)}</span></td>
        <td><span class="st ${ACTION_CLS[act] || ""}">${esc(ACTION_TEXT[act] || act)}</span></td>
        <td><strong>${esc(rec.slug || "—")}</strong> ${plat}${undoCtl}
          <div class="detail">${esc(historyDetail(rec)) || "—"}</div></td></tr>`;
    }).join("")}</tbody></table></div>${pagerBar("history", pg)}`;
}

// ---- 零依赖 Markdown 渲染（先整体转义再有限解析，无 XSS 注入面） ----
function mdToHtml(src) {
  const lines = String(src).replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;
  // 行内转换：转义后的文本上做有限替换；链接仅允许 http(s)
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (_m, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // frontmatter 元数据折叠展示，不混入正文
  if (lines[0] && lines[0].trim() === "---") {
    let end = -1;
    for (let k = 1; k < lines.length; k++)
      if (lines[k].trim() === "---") { end = k; break; }
    if (end > 0) {
      out.push(`<details class="md-fm"><summary>FRONTMATTER · 元数据</summary><pre>${esc(lines.slice(1, end).join("\n"))}</pre></details>`);
      i = end + 1;
    }
  }
  const isTableSep = l => /^\s*\|[\s:|-]+\|\s*$/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre class="md-code"><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(line); i += 2;
      const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(cells(lines[i++]));
      out.push(`<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${
        body.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${mdToHtml(buf.join("\n"))}</blockquote>`);
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = []; let cur = null;
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        const indent = lines[i].match(/^\s*/)[0].length;
        const text = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, "");
        if (indent >= 2 && cur) cur.sub.push(text);
        else { cur = { text, sub: [] }; items.push(cur); }
        i++;
      }
      const lis = items.map(it => `<li>${inline(it.text)}${
        it.sub.length ? `<${ordered ? "ol" : "ul"}>${it.sub.map(s => `<li>${inline(s)}</li>`).join("")}</${ordered ? "ol" : "ul"}>` : ""}</li>`).join("");
      out.push(`<${ordered ? "ol" : "ul"}>${lis}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const buf = [line]; i++;
    while (i < lines.length && lines[i].trim() &&
      !/^\s*(#{1,6}\s|```|>|\|)/.test(lines[i]) &&
      !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) &&
      !/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${buf.map(inline).join("<br>")}</p>`);
  }
  return out.join("\n");
}

// SKILL.md 只读查看器：默认 Markdown 渲染，可切原文；英文内容提供离线英译中（译文仅预览，不落盘）
function isMostlyEnglish(text) {
  const cjk = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  const lat = (text.match(/[A-Za-z]/g) || []).length;
  return lat > 20 && cjk < Math.max(3, lat / 4);
}

function showSkillViewer(title, meta, content) {
  const english = isMostlyEnglish(content);
  let translated = null, showingZh = false, rawMode = false;
  modal(title,
    `<div class="meta-line">${meta}<span class="view-toggle">
       <button id="modeRawBtn" title="查看未经排版的原始文本">原文</button><button id="modeMdBtn" class="active" title="渲染标题/代码块/表格等排版">渲染</button>
     </span></div><div class="md-body" id="mdBody"></div>`,
    `<button onclick="closeModal()">关闭</button>` +
    (english ? `<button class="primary" id="translateBtn">译为中文</button>` : ""));
  const paint = () => {
    const text = showingZh ? translated : content;
    $("#mdBody").innerHTML = rawMode
      ? `<pre class="skill-view">${esc(text)}</pre>`
      : `<div class="md-view">${mdToHtml(text)}</div>`;
    $("#modeRawBtn").classList.toggle("active", rawMode);
    $("#modeMdBtn").classList.toggle("active", !rawMode);
  };
  $("#modeRawBtn").onclick = () => { rawMode = true; paint(); };
  $("#modeMdBtn").onclick = () => { rawMode = false; paint(); };
  paint();
  const btn = $("#translateBtn");
  if (!btn) return;
  PRETRANS.paused = true; paintPretransChip();  // 批处理让路，详情翻译优先
  // 自动预热：弹窗打开即在后台开译，稍后点「译为中文」通常瞬时出结果
  let prewarmed = null;
  if (english) {
    prewarmed = DOC_TR.get(content) || null;
    if (!prewarmed) {
      prewarmed = api("/api/translate", { method: "POST", body: { text: content } })
        .catch(e => { DOC_TR.delete(content); throw e; });
      DOC_TR.set(content, prewarmed);
      if (DOC_TR.size > 24) DOC_TR.delete(DOC_TR.keys().next().value);
    }
    prewarmed.catch(() => {});  // 预热失败静默，点按钮时再报
  }
  btn.onclick = async () => {
    if (translated !== null) {
      showingZh = !showingZh;
      paint();
      btn.textContent = showingZh ? "查看原文" : "译为中文";
      return;
    }
    btn.disabled = true; btn.textContent = "翻译中…（本地离线模型）";
    try {
      const r = await (prewarmed || api("/api/translate", { method: "POST", body: { text: content } }));
      if (r.skipped) { btn.remove(); return; }
      translated = r.translated; showingZh = true;
      paint();
      btn.textContent = "查看原文"; btn.disabled = false;
      toast(`翻译引擎：${r.engine}（仅预览，不写文件）`, "ok");
    } catch (e) {
      prewarmed = null;  // 失败后下次点击重新发起
      btn.disabled = false; btn.textContent = "译为中文";
      toast(e.message, "err");
    }
  };
}

  try {
    const r = await api("/api/resolve", { method: "POST", body: { platform, name, winner } });
    closeModal(); toast(`裁决完成：${r.result.detail}`, "ok"); await refresh();
  } catch (e) { toast(e.message, "err"); }
};

window.ignoreOne = async function (platform, name) {
  try { await api("/api/ignore", { method: "POST", body: { platform, name } });
    toast(`已忽略 ${platform}/${name}`, "ok"); await refresh();
  } catch (e) { toast(e.message, "err"); }
};
window.unignoreOne = async function (platform, name) {
  try { await api("/api/ignore", { method: "POST", body: { platform, name, remove: true } });
    toast("已取消忽略", "ok"); await refresh();
  } catch (e) { toast(e.message, "err"); }
};

// 归档：catalog 级「退役」标记（区别于 ignore 的单条豁免），该技能所有异常不再催办
window.archiveOne = async function (slug, archived) {
  if (!confirm(archived
    ? `确认归档【${slug}】？\n归档后该技能的所有异常与待采纳提示都不再催办（可随时在技能库恢复）。`
    : `确认取消归档【${slug}】？其异常将恢复显示与催办。`)) return;
  try {
    await api("/api/archive", { method: "POST", body: { slug, archived } });
    toast(archived ? `已归档 ${slug}（异常不再催办）` : `已取消归档 ${slug}`, "ok");
    HISTORY = null;
    await refresh();
  } catch (e) { toast(e.message, "err"); }
};

async function runApply(write, link, force, platform, only) {
  const label = write ? "这会实际改动平台目录（实体目录先备份）。确认执行？" : "预演不会改动任何文件。";
  if (!confirm(label)) return;
  try {
    const r = await api("/api/apply", { method: "POST",
      body: { write, link, force, platform: platform || null, only: only || null } });
    const lines = r.actions.map(a => `[${a.platform}] ${a.slug} ${a.kind} — ${a.detail}`);
    modal(write ? "apply 执行结果" : "apply 预演结果",
      `<div class="meta-line">${r.refused.length ? r.refused.length + " 项被安全拒绝" : "全部可执行 · ALL CLEAR"}</div>
       <pre class="out">${esc(lines.join("\n") || "（无动作）")}</pre>`,
      `<button onclick="closeModal()">关闭</button>`);
    if (write) await refresh();
  } catch (e) { toast(e.message, "err"); }
}
window.applyOnly = (p, n) => runApply(true, true, false, p, n);
window.applyForce = (p, n) => runApply(true, true, true, p, n);

$("#applyDry").onclick = () => runApply(false, true, false);
$("#applyWriteLink").onclick = () => runApply(true, true, false);
$("#refreshBtn").onclick = refresh;
const TAB_HINTS = {
  pending: "待采纳：平台目录里的新技能或重复副本，尚未纳入共享仓。可先「查看」了解用途（英文可译为中文），再决定采纳进 canonical 或忽略。",
  problems: "问题与分叉：需要处理的异常——平台副本与共享仓内容分叉、软链损坏、平台缺目标、外来软链、SKILL.md 元数据异常等，可查看差异或详情后裁决修复。",
  managed: "已纳管 / 忽略：已通过软链下发到各平台的技能（改动会同步两端），以及被忽略、不再参与同步的技能。",
  library: "技能库：共享仓 canonical 中的技能本体，是唯一事实源；各平台目录里都只是它的软链或副本。",
  history: "操作历史：adopt（采纳）/ resolve（裁决）/ apply（下发）/ ignore（忽略）的结构化留痕，来自 registry/audit.logl，最新在前；支持搜索与平台筛选。"
};
function updateTabsHint() {
  const active = document.querySelector("#tabs button.active");
  $("#tabsHint").textContent = TAB_HINTS[active?.dataset.tab] || "";
}
$("#tabs").addEventListener("click", e => {
  const btn = e.target.closest("button[data-tab]");
  if (btn) {
    document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    updateTabsHint();
    render();
  }
});
updateTabsHint();

refresh().catch(e => toast("初始扫描失败：" + e.message, "err"));
</script>
</body>
</html>
